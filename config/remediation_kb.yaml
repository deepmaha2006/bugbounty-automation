    tags: ["request-smuggling", "http", "proxy"]

  # --- DDoS / business logic / subdomain takeover (user-supplied) ---------
  # ---------- ddos ----------

  - key: ddos.missing_rate_limiting
    kind: vulnerability
    aliases:
      - "Missing Rate Limiting"
    category: ddos
    cwe: CWE-770
    owasp: "A04:2021-Insecure Design"
    severity_guidance: >-
      Medium by default; High when the unlimited endpoint is auth, password-reset,
      OTP, or an expensive operation enabling abuse/brute force. Lower for cheap,
      non-sensitive endpoints.
    exploitability: >-
      High. Sending many requests requires no special tooling.
    business_impact: >-
      Brute-force, resource exhaustion, cost inflation, and degraded availability.
    why_it_matters: >-
      Endpoints without limits allow abuse and denial of service.
    detection_signal: >-
      Repeated requests to an endpoint are accepted without throttling or lockout.
    false_positive_check: >-
      Confirm no upstream limiter (WAF/CDN) is enforcing limits and that the
      endpoint truly lacks throttling.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Add rate limiting at the edge/WAF for the affected endpoint, especially
        auth and expensive routes.
      short_term_fix: >-
        Implement per-user/per-IP rate limits and lockout/backoff on sensitive
        actions in the application.
      long_term_hardening: >-
        Standardize rate-limiting middleware, quotas, and monitoring across the API.
      code_fix_examples:
        python: >-
          Apply a rate-limiter dependency/middleware with per-key windows on
          sensitive routes.
        node: >-
          Use a rate-limit middleware keyed by user/IP on auth and costly endpoints.
      config_examples:
        nginx: >-
          Use limit_req_zone / limit_req to throttle sensitive locations.
    verification: >-
      Confirm the endpoint returns 429 (or lockout) after the configured threshold
      of benign requests.
    compensating_controls:
      - "Edge/WAF rate limiting"
      - "Account lockout / CAPTCHA on auth"
    references:
      - "https://owasp.org/Top10/A04_2021-Insecure_Design/"
      - "https://cwe.mitre.org/data/definitions/770.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["rate-limiting", "availability", "abuse"]

  - key: ddos.weak_rate_limiting
    kind: vulnerability
    aliases:
      - "Weak Rate Limiting"
    category: ddos
    cwe: CWE-770
    owasp: "A04:2021-Insecure Design"
    severity_guidance: >-
      Low by default; raise to Medium if the weak limit still permits brute force
      or abuse of a sensitive endpoint.
    exploitability: >-
      Medium. Limits exist but are too permissive to prevent abuse.
    business_impact: >-
      Partial protection that still allows brute force or resource abuse.
    why_it_matters: >-
      Thresholds set too high do not meaningfully prevent abuse.
    detection_signal: >-
      Throttling exists but permits a high request volume before limiting.
    false_positive_check: >-
      Confirm the observed threshold is actually too permissive for the endpoint's
      sensitivity.
    triage_priority: P4
    remediation:
      immediate_mitigation: >-
        Tighten thresholds on sensitive endpoints to appropriate levels.
      short_term_fix: >-
        Set per-action limits based on risk; add backoff/lockout on auth.
      long_term_hardening: >-
        Periodically tune limits from real traffic and abuse patterns.
      code_fix_examples: {}
      config_examples: {}
    verification: >-
      Confirm the tightened limit triggers throttling at the intended benign
      threshold.
    compensating_controls:
      - "Edge rate limiting"
      - "Anomaly monitoring"
    references:
      - "https://owasp.org/Top10/A04_2021-Insecure_Design/"
      - "https://cwe.mitre.org/data/definitions/770.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["rate-limiting", "availability"]

  - key: ddos.no_connection_limiting
    kind: vulnerability
    aliases:
      - "No Connection Limiting"
    category: ddos
    cwe: CWE-770
    owasp: "A04:2021-Insecure Design"
    severity_guidance: >-
      Low by default; raise to Medium for internet-facing services where connection
      floods could exhaust resources.
    exploitability: >-
      Medium. Requires many concurrent connections.
    business_impact: >-
      Resource exhaustion and degraded availability under connection floods.
    why_it_matters: >-
