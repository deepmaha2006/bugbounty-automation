  # ---------- sub_takeover ----------

  - key: sub_takeover.subdomain_takeover
    kind: vulnerability
    aliases:
      - "Subdomain Takeover"
    category: sub_takeover
    cwe: CWE-668
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Critical when a dangling DNS record points to an unclaimed third-party
      resource that can be claimed, letting content be served on the subdomain.
      Lower if the record is internal-only or not claimable.
    exploitability: >-
      High. Claiming the referenced resource serves attacker content on the
      subdomain.
    business_impact: >-
      Hosting of malicious content on a trusted subdomain, phishing, and cookie/
      trust abuse.
    why_it_matters: >-
      Dangling DNS to decommissioned services lets others claim the subdomain.
    detection_signal: >-
      A subdomain's DNS points to a third-party service whose resource returns an
      unclaimed/not-found fingerprint.
    false_positive_check: >-
      Confirm the target resource is genuinely unclaimed/claimable, not a temporary
      error or an intentionally parked resource.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Remove or correct the dangling DNS record now, or reclaim the referenced
        resource.
      short_term_fix: >-
        Reconcile DNS with active resources; delete records for decommissioned
        services.
      long_term_hardening: >-
        Automate DNS/asset reconciliation and monitor for dangling records.
      code_fix_examples: {}
      config_examples: {}
    verification: >-
      Confirm the DNS record is removed/reclaimed and the subdomain no longer points
      to an unclaimed resource.
    compensating_controls:
      - "Continuous DNS/asset monitoring"
      - "Decommissioning checklist including DNS cleanup"
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/668.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["subdomain-takeover", "dns", "misconfiguration"]

