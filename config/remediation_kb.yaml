# HydraX remediation knowledge base — DATA ONLY (no executable content).
#
# Loaded and validated by webapp/services/remediation_kb.py. One entry per
# finding type the platform can emit; the resolver (remediation_service)
# matches a normalized finding dict to an entry and returns an analyst report.
#
# ---------------------------------------------------------------------------
# SCHEMA (every field required unless marked optional)
# ---------------------------------------------------------------------------
# key                 canonical id, "<category>.<slug>" — unique, lowercase
# kind                "vulnerability" | "signal"
#                     signal = informational/recon observation: remediation
#                     describes verify/monitor steps, never a fabricated fix
# aliases             list of exact finding-type strings the scanners emit
#                     (matched case-insensitively) — unique across the KB
# category            scanner key (config/settings.py SCANNER_CATEGORIES) or
#                     "local_tools"
# cwe                 specific CWE id for this type, e.g. "CWE-89"
# owasp               OWASP Top 10 2021 id, e.g. "A03:2021-Injection"
# severity_guidance   Critical | High | Medium | Low | Info (typical rating)
#                     + optional one-line note on when to raise/lower it
# exploitability      High | Medium | Low  (+ short note)
# business_impact     what the organization loses if this is abused
# why_it_matters      analyst-facing explanation, 1–3 sentences
# detection_signal    what in the scan output indicates this finding
# false_positive_check  how an analyst rules out a false positive
# triage_priority     P1 (act now) | P2 (this sprint) | P3 (planned) | P4 (backlog/monitor)
# remediation:
#   immediate_mitigation   stop-gap to reduce exposure today
#   short_term_fix         the actual fix
#   long_term_hardening    process/architecture changes to prevent recurrence
#   code_fix_examples      map of stack -> guidance text (optional per stack)
#   config_examples        map of platform -> guidance text (optional per platform)
# compensating_controls  list of controls if the fix can't ship immediately
# verification         how to retest safely (non-destructive)
# references           list of https URLs (OWASP / CWE / cheat sheets)
# tags                 list of short lowercase labels
# ---------------------------------------------------------------------------

schema_version: 1

entries:

  # --- Critical exemplar ----------------------------------------------------
  - key: sqli.injection
    kind: vulnerability
    aliases:
      - SQL Injection
      - Error-based SQL Injection
      - Union-based SQL Injection
      - Time-based SQL Injection
      - Boolean-based Blind SQL Injection
      - Out-of-band SQL Injection Attempt
    category: sqli
    cwe: CWE-89
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      Critical. Lower to High only if the affected query runs under a
      read-only account with no access to sensitive tables.
    exploitability: High — well-understood class with mature public tooling.
    business_impact: >-
      Unauthorized read or modification of database contents, including
      credentials and customer data; possible full application compromise.
    why_it_matters: >-
      User input reaches a SQL statement without being bound as data, so the
      database can be made to run statements the application never intended.
    detection_signal: >-
      Database error text, response differences between logically equivalent
      inputs, or timing differences tied to a specific parameter.
    false_positive_check: >-
      Re-issue the request with a benign value and confirm the differing
      behaviour is reproducible and specific to the parameter; generic 500
      errors or WAF block pages alone are not sufficient evidence.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Add a WAF/virtual-patch rule for the affected parameter and reduce the
        database account's privileges while the code fix is prepared.
      short_term_fix: >-
        Replace string-built SQL with parameterized queries / prepared
        statements for every query touching the parameter; validate input
        type and length server-side.
      long_term_hardening: >-
        Standardize on an ORM or query builder, run the app with a
        least-privilege DB account, and add SAST rules that flag string
        concatenation into query APIs.
      code_fix_examples:
        python: >-
          Use DB-API placeholders — cursor.execute("SELECT * FROM users WHERE
          id = %s", (user_id,)) — never f-strings or % formatting into SQL.
        java: >-
          Use PreparedStatement with ? placeholders and setString/setInt;
          avoid Statement.executeQuery with concatenated strings.
        node: >-
          Use the driver's parameter binding (e.g. pg: client.query(text,
          values)) or an ORM; never template-literal user input into SQL.
        php: >-
          Use PDO prepared statements with bound parameters; disable
          PDO::ATTR_EMULATE_PREPARES where supported.
      config_examples:
        database: >-
          Grant the application account only the privileges it needs (no DDL,
          no access to system catalogs beyond requirements).
    compensating_controls:
      - WAF rule set tuned for SQL injection on the affected endpoint
      - Least-privilege database account
      - Database activity monitoring with alerting on anomalous queries
    verification: >-
      Re-run the platform's SQL injection check against the same parameter
      and confirm no error, boolean, or timing differential remains; confirm
      the code change uses bound parameters in review.
    references:
      - https://owasp.org/Top10/A03_2021-Injection/
      - https://cwe.mitre.org/data/definitions/89.html
      - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
    tags: [injection, database, owasp-a03]

  # --- Medium exemplar ------------------------------------------------------
  - key: sec_misconfig.missing_security_header
    kind: vulnerability
    aliases:
      - Missing Security Header
    category: sec_misconfig
    cwe: CWE-693
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Medium by default. Raise when the missing header is Content-Security-Policy
      on a page with confirmed XSS; lower to Low for non-HTML API responses.
      Several header findings on one host correlate into an
      "HTTP Security Hardening Gap" issue.
    exploitability: Low — enables or amplifies other attacks rather than being exploitable alone.
    business_impact: >-
      Weakens browser-side defenses, increasing the impact of XSS,
      clickjacking, MIME-sniffing, and protocol-downgrade issues.
    why_it_matters: >-
      Security headers let the browser enforce protections the application
      would otherwise have to get right everywhere; their absence removes a
      defense-in-depth layer.
    detection_signal: >-
      HTTP responses lack one or more of Content-Security-Policy,
      Strict-Transport-Security, X-Content-Type-Options, Referrer-Policy, or
      frame protections.
    false_positive_check: >-
      Confirm the header is missing on the final response (not just a
      redirect), and check whether it is set by a CDN/reverse proxy on the
      production path but not on the scanned origin.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Add the missing headers at the reverse proxy or CDN edge so every
        response is covered without an application release.
      short_term_fix: >-
        Set the headers centrally in the application's response middleware:
        HSTS (with a suitable max-age), X-Content-Type-Options: nosniff,
        Referrer-Policy, frame protections, and a restrictive CSP.
      long_term_hardening: >-
        Keep a baseline header policy in shared config, test it in CI, and
        roll out CSP in report-only mode first to tighten it safely.
      code_fix_examples:
        python: >-
          FastAPI/Starlette: add an HTTP middleware that sets the headers on
          every response. Django: enable SecurityMiddleware and set
          SECURE_HSTS_SECONDS, SECURE_CONTENT_TYPE_NOSNIFF.
        node: >-
          Express: use the helmet middleware and configure its CSP directive
          explicitly rather than relying on defaults.
        java: >-
          Spring Security: configure headers() in the security filter chain
          (contentSecurityPolicy, httpStrictTransportSecurity).
      config_examples:
        nginx: >-
          add_header directives with the "always" flag in the server block so
          the headers are also sent on error responses.
        apache: >-
          mod_headers "Header always set" directives in the virtual host.
    compensating_controls:
      - Headers enforced at the CDN / load balancer
      - Strict output encoding to reduce reliance on CSP
    verification: >-
      Request the affected URLs and confirm each header is present with the
      intended value on success, redirect, and error responses.
    references:
      - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
      - https://cwe.mitre.org/data/definitions/693.html
      - https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html
      - https://owasp.org/www-project-secure-headers/
    tags: [headers, hardening, owasp-a05]

  # --- Info / signal exemplar -----------------------------------------------
  - key: recon.technology_fingerprint
    kind: signal
    aliases:
      - Technology Stack Fingerprinting
      - Technology Fingerprint
    category: recon
    cwe: CWE-200
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Info. Raise only if the identified component version has a known,
      applicable vulnerability — that is then a separate finding.
    exploitability: Low — informational; aids an attacker's reconnaissance only.
    business_impact: >-
      None directly. Disclosed stack details can shorten an attacker's
      research time against known component weaknesses.
    why_it_matters: >-
      Knowing the exact technologies in use tells the defender which
      advisories to track; it tells an attacker the same thing.
    detection_signal: >-
      Framework, server, or library identifiers observed in headers, cookies,
      markup, or asset paths.
    false_positive_check: >-
      Confirm the identified technology is actually in the production path
      (not a stale asset or a third-party embed).
    triage_priority: P4
    remediation:
      immediate_mitigation: No action required — this is an observation, not a flaw.
      short_term_fix: >-
        Verify: record the identified components and versions in the asset
        inventory and check them against current vendor advisories.
      long_term_hardening: >-
        Monitor: subscribe to advisories for these components and, where
        practical, suppress unnecessary version banners.
      code_fix_examples: {}
      config_examples: {}
    compensating_controls:
      - Maintained software inventory (SBOM) with advisory tracking
    verification: >-
      Confirm the components appear in the asset inventory with an owner and
      a patch-tracking process.
    references:
      - https://cwe.mitre.org/data/definitions/200.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/08-Fingerprint_Web_Application_Framework
    tags: [recon, inventory, signal]

  # --- XSS ------------------------------------------------------------------
  - key: xss.reflected
    kind: vulnerability
    aliases:
      - Reflected XSS
    category: xss
    cwe: CWE-79
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      High by default. Raise to Critical on authenticated pages that handle
      sessions or payments with no CSP; lower to Medium when a strict CSP
      (no unsafe-inline, nonce/hash based) is enforced and cookies are HttpOnly.
    exploitability: >-
      Medium — requires a victim to open a crafted link, but the technique is
      widely known and needs no special access.
    business_impact: >-
      Session hijacking, actions performed as the victim, credential phishing
      on the trusted domain, and reputational damage.
    why_it_matters: >-
      Input from the request is written back into the page without
      context-appropriate encoding, so the browser can treat attacker-supplied
      text as script running in the site's origin.
    detection_signal: >-
      A marker value sent in a parameter is returned unencoded in an HTML,
      attribute, or script context of the same response.
    false_positive_check: >-
      Inspect the raw response: confirm the reflected value lands unencoded in
      an executable context (not inside a text node that is HTML-encoded, a
      JSON response served as application/json, or a comment). A reflection
      that is entity-encoded is not XSS.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Deploy a WAF rule for the affected parameter and ship a restrictive
        Content-Security-Policy (at minimum in report-only mode) at the edge.
      short_term_fix: >-
        Apply context-aware output encoding where the parameter is rendered
        (HTML body, attribute, JavaScript, URL contexts each need their own
        encoder) and validate the parameter against an allow-list of expected
        values or formats.
      long_term_hardening: >-
        Use a templating engine with auto-escaping on by default, forbid raw
        HTML helpers in code review/lint, enforce a nonce- or hash-based CSP,
        and set session cookies HttpOnly.
      code_fix_examples:
        python: >-
          Jinja2/Django templates auto-escape by default — keep autoescape on
          and avoid |safe / mark_safe on request data.
        node: >-
          Render through an auto-escaping view engine or React's default JSX
          escaping; never pass request data to dangerouslySetInnerHTML.
        java: >-
          Use JSP/Thymeleaf escaping (th:text, not th:utext) or the OWASP Java
          Encoder for the specific output context.
        php: >-
          Wrap output in htmlspecialchars($value, ENT_QUOTES, 'UTF-8') or use a
          template engine (Twig) with auto-escaping enabled.
      config_examples:
        nginx: >-
          add_header Content-Security-Policy "default-src 'self'; script-src
          'self'; object-src 'none'; base-uri 'self'" always;
    compensating_controls:
      - Strict Content-Security-Policy without unsafe-inline
      - HttpOnly and SameSite session cookies
      - WAF rule on the affected parameter
    verification: >-
      Re-run the platform's XSS check on the same parameter and confirm the
      marker is returned encoded; confirm the CSP header is present on the page.
    references:
      - https://owasp.org/Top10/A03_2021-Injection/
      - https://cwe.mitre.org/data/definitions/79.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/01-Testing_for_Reflected_Cross_Site_Scripting
    tags: [xss, injection, client-side, owasp-a03]

  - key: xss.stored
    kind: vulnerability
    aliases:
      - Stored XSS
    category: xss
    cwe: CWE-79
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      Critical by default — it fires for every user who views the content.
      Lower to High when the content is only visible to the submitting user or
      a strict CSP is enforced.
    exploitability: >-
      High — no victim interaction beyond normal browsing; persists until the
      stored data is cleaned.
    business_impact: >-
      Mass account compromise, including privileged users who view the
      content; persistent defacement; data theft at scale.
    why_it_matters: >-
      User-supplied content is saved and later rendered to other users without
      encoding, so script planted once runs in every viewer's session.
    detection_signal: >-
      A marker submitted through a form or API is later served unencoded in an
      executable context on a page that renders stored content.
    false_positive_check: >-
      Confirm the stored value is rendered unencoded on a different request
      (not just echoed in the submit response), and in a context the browser
      executes.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Disable or hide the affected rendering view, search the datastore for
        stored script content and quarantine it, and enable a restrictive CSP.
      short_term_fix: >-
        Encode stored content on output for its rendering context; where rich
        text is required, sanitize it server-side with a maintained allow-list
        HTML sanitizer before storage and again before rendering.
      long_term_hardening: >-
        Treat all stored user content as untrusted at render time, enforce a
        nonce/hash CSP, and add stored-content XSS checks to regression tests.
      code_fix_examples:
        python: >-
          Keep template auto-escaping on; for rich text use a maintained
          sanitizer (e.g. nh3/bleach successor) with an explicit tag allow-list.
        node: >-
          Sanitize rich text with DOMPurify (server-side via jsdom) using a
          strict allow-list; render everything else as text.
        java: >-
          Sanitize with the OWASP Java HTML Sanitizer policy builder; encode all
          other fields with the OWASP Java Encoder.
        php: >-
          Use HTML Purifier for rich text and htmlspecialchars for all other
          output.
      config_examples: {}
    compensating_controls:
      - Strict Content-Security-Policy
      - HttpOnly session cookies and short session lifetime for privileged users
      - Moderation queue for user-submitted rich content
    verification: >-
      Re-submit a harmless marker and confirm it renders as inert text for
      other users; confirm previously stored script content has been removed.
    references:
      - https://owasp.org/Top10/A03_2021-Injection/
      - https://cwe.mitre.org/data/definitions/79.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/02-Testing_for_Stored_Cross_Site_Scripting
    tags: [xss, injection, persistent, owasp-a03]

  - key: xss.blind
    kind: vulnerability
    aliases:
      - Blind XSS
    category: xss
    cwe: CWE-79
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      High by default. Raise to Critical when the content renders in an admin
      or support back-office; Medium when only an unverified callback was seen.
    exploitability: >-
      Medium — execution happens later in another application or user's view,
      so impact depends on who reviews the stored content.
    business_impact: >-
      Compromise of internal staff sessions (support, admin, moderation tools)
      that can expose customer data and privileged functions.
    why_it_matters: >-
      Input stored by the public app is rendered unencoded in a different,
      often internal, interface — the same flaw as stored XSS, seen indirectly.
    detection_signal: >-
      A submitted value is later rendered where the scanner cannot see it
      directly; confirmation comes from an out-of-band callback.
    false_positive_check: >-
      Confirm the callback is tied to the specific submission and reached from
      a real rendering context (user agent/referrer of the internal tool), not
      from a link-preview or security-scanning service.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Identify which internal tool renders the field and apply a CSP to it;
        purge the stored submissions that triggered the callback.
      short_term_fix: >-
        Encode the field on output in every consumer (including internal
        dashboards, ticketing, and log viewers), not just in the public app.
      long_term_hardening: >-
        Apply the same output-encoding and CSP standards to internal tools as
        to public ones; inventory every system that renders user-submitted data.
      code_fix_examples:
        python: Keep auto-escaping on in the internal tool's templates as well.
        node: Render user data as text in internal dashboards; no raw HTML sinks.
      config_examples: {}
    compensating_controls:
      - CSP on internal/admin applications
      - Internal tools reachable only from the corporate network or VPN
    verification: >-
      Re-submit a harmless marker and confirm it appears as inert text in each
      internal consumer and no callback is received.
    references:
      - https://cwe.mitre.org/data/definitions/79.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    tags: [xss, injection, out-of-band, owasp-a03]

  - key: xss.dom
    kind: vulnerability
    aliases:
      - DOM-based XSS
    category: xss
    cwe: CWE-79
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      High by default. Lower to Medium when the source is not attacker
      controllable cross-origin (e.g. only localStorage written by the app).
    exploitability: >-
      Medium — needs a crafted URL or controllable client-side source; often
      invisible to server-side logs and WAFs.
    business_impact: >-
      Same as reflected XSS: session and account compromise within the
      application's origin.
    why_it_matters: >-
      Client-side JavaScript copies attacker-controllable data (URL fragment,
      query, postMessage) into a dangerous sink without sanitization.
    detection_signal: >-
      A marker placed in a client-side source reaches an executing DOM sink
      in the rendered page.
    false_positive_check: >-
      Confirm in the browser that the source value actually flows to the sink
      unmodified and executes; framework bindings that assign text (not HTML)
      are safe.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Ship a strict CSP with Trusted Types in report-only mode to identify
        the sink, then enforce.
      short_term_fix: >-
        Replace the sink with a safe API (textContent instead of innerHTML,
        setAttribute on non-URL attributes), or sanitize with DOMPurify before
        assigning HTML; validate URL values against an allow-listed scheme.
      long_term_hardening: >-
        Enforce Trusted Types via CSP, and add lint rules that ban innerHTML,
        document.write, and eval-style sinks.
      code_fix_examples:
        node: >-
          Front-end: element.textContent = value; for HTML use
          DOMPurify.sanitize(value) under a Trusted Types policy.
      config_examples:
        nginx: >-
          add_header Content-Security-Policy "require-trusted-types-for 'script'" always;
    compensating_controls:
      - CSP with Trusted Types
      - ESLint rules banning unsafe DOM sinks
    verification: >-
      Re-run the platform's DOM XSS check and confirm the marker renders as
      text; confirm Trusted Types violations are reported, not executed.
    references:
      - https://cwe.mitre.org/data/definitions/79.html
      - https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/01-Testing_for_DOM-based_Cross_Site_Scripting
    tags: [xss, dom, client-side, owasp-a03]

  - key: xss.dom_sink
    kind: vulnerability
    aliases:
      - DOM-based XSS Sinks Detected
    category: xss
    cwe: CWE-79
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      Medium — a code-quality risk, not a confirmed flaw. Raise to High only
      if a controllable source is shown to reach the sink (then it is xss.dom).
    exploitability: Low — requires a separate, controllable source to be exploitable.
    business_impact: >-
      Latent XSS risk that becomes exploitable when future code routes user
      data into the sink.
    why_it_matters: >-
      The page's JavaScript uses APIs that interpret strings as HTML or code.
      They are safe only while every value passed to them is trusted.
    detection_signal: >-
      Client-side scripts contain dangerous sinks (innerHTML, document.write,
      eval-style calls) without a confirmed attacker-controlled source.
    false_positive_check: >-
      Review each sink's inputs: if all values are constants or already
      sanitized, record it as accepted risk; if any trace to URL, storage, or
      message data, escalate to xss.dom.
    triage_priority: P3
    remediation:
      immediate_mitigation: No emergency action — schedule a code review of the listed sinks.
      short_term_fix: >-
        Refactor sinks to safe APIs (textContent, createElement) or route
        every HTML assignment through a single sanitizing helper.
      long_term_hardening: >-
        Enforce Trusted Types and lint rules so new unsafe sinks fail CI.
      code_fix_examples:
        node: Replace innerHTML assignments with textContent or a DOMPurify-backed helper.
      config_examples: {}
    compensating_controls:
      - CSP with Trusted Types in report-only mode to surface sink usage
    verification: >-
      Re-scan and confirm the sinks are gone or wrapped by the sanitizing
      helper; confirm lint rules block reintroduction.
    references:
      - https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
      - https://cwe.mitre.org/data/definitions/79.html
    tags: [xss, dom, code-review]

  # --- SSRF -----------------------------------------------------------------
  - key: ssrf.confirmed
    kind: vulnerability
    aliases:
      - SSRF Confirmed
    category: ssrf
    cwe: CWE-918
    owasp: "A10:2021-Server-Side Request Forgery"
    severity_guidance: >-
      Critical when the server was shown to reach internal addresses or cloud
      metadata; High when only external destinations were reached; lower one
      level if egress is already restricted to a narrow allow-list.
    exploitability: >-
      High — the server has been observed making requests to a destination
      chosen through user input; no authentication bypass is needed.
    business_impact: >-
      Access to internal services and cloud instance credentials that are not
      exposed to the internet, potentially leading to wider infrastructure
      compromise and data exposure.
    why_it_matters: >-
      The application fetches a URL taken from user input without restricting
      where it may go, so the server can be used as a proxy into networks and
      services that trust it.
    detection_signal: >-
      An out-of-band interaction or an internal-only response was observed as
      a direct result of a value supplied in a request parameter.
    false_positive_check: >-
      Confirm the interaction originated from the application server's own IP
      or network (not the scanner or a link-preview/CDN service), and that it
      was triggered by the specific parameter. A URL merely echoed back in the
      response, without a server-side request, is not SSRF.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Block outbound traffic from the application host to internal ranges
        (RFC 1918, loopback, link-local 169.254.0.0/16) and to the cloud
        metadata address at the host firewall or security group, and restrict
        the affected feature to an allow-list of destinations.
      short_term_fix: >-
        Validate the destination server-side against an allow-list of
        permitted hosts and schemes (https only), resolve the hostname and
        re-check the resolved IP against blocked ranges before connecting,
        disable redirects (or re-validate each hop), and remove URL-fetching
        features that are not needed.
      long_term_hardening: >-
        Route outbound fetches through an egress proxy that enforces the
        allow-list, segment the application network from internal services,
        enforce IMDSv2 / metadata-endpoint protections, and standardize on a
        shared SSRF-safe HTTP client wrapper.
      code_fix_examples:
        python: >-
          Parse with urllib.parse, require scheme 'https' and a host in an
          allow-list, resolve with socket.getaddrinfo and reject any address
          where ipaddress.ip_address(ip).is_private / is_loopback /
          is_link_local / is_reserved is true, then connect to the vetted IP
          with allow_redirects=False.
        node: >-
          Validate with the WHATWG URL parser against an allow-list; use an
          HTTP agent that checks the resolved IP at connect time (a lookup hook
          rejecting private ranges) and disable automatic redirects.
        java: >-
          Validate java.net.URI against an allow-list; resolve with
          InetAddress and reject isSiteLocalAddress / isLoopbackAddress /
          isLinkLocalAddress before opening the connection; disable
          HttpURLConnection redirects.
        php: >-
          Validate with parse_url against an allow-list; resolve with
          gethostbynamel and reject private/reserved ranges using
          filter_var(..., FILTER_VALIDATE_IP, FILTER_FLAG_NO_PRIV_RANGE |
          FILTER_FLAG_NO_RES_RANGE); set CURLOPT_FOLLOWLOCATION to false.
      config_examples:
        cloud: >-
          AWS: require IMDSv2 (HttpTokens=required) and a hop limit of 1;
          GCP/Azure: require the metadata request header and restrict metadata
          access where the workload does not need it.
        network: >-
          Egress firewall / security group that denies internal and link-local
          destinations from the application tier by default.
    compensating_controls:
      - Egress firewall denying internal, loopback, and link-local ranges
      - Metadata endpoint hardening (IMDSv2 / required metadata headers)
      - Outbound proxy with destination allow-list and logging
    verification: >-
      Re-run the platform's SSRF check with a harmless out-of-band marker and
      an internal-range destination and confirm both are rejected by the
      application (validation error) and that no outbound request is logged.
    references:
      - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
      - https://cwe.mitre.org/data/definitions/918.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/19-Testing_for_Server-Side_Request_Forgery
    tags: [ssrf, network, owasp-a10]

  - key: ssrf.form_input
    kind: vulnerability
    aliases:
      - SSRF via Form Input
    category: ssrf
    cwe: CWE-918
    owasp: "A10:2021-Server-Side Request Forgery"
    severity_guidance: >-
      High by default. Raise to Critical if the form is unauthenticated and
      internal destinations were reached; lower to Medium if only an external
      callback was observed and egress is restricted.
    exploitability: >-
      High — reachable through a normal form submission (e.g. avatar-from-URL,
      import, webhook, or preview fields).
    business_impact: >-
      Same as confirmed SSRF: internal service access and potential cloud
      credential exposure via a user-facing feature.
    why_it_matters: >-
      A form field that accepts a URL causes the server to fetch it, and the
      destination is not restricted.
    detection_signal: >-
      Submitting a URL in a form field produced a server-originated request to
      the supplied destination.
    false_positive_check: >-
      Confirm the fetch came from the application server after the form was
      submitted (check source IP and timing); a field that only stores the URL
      as text, with no server-side fetch, is not SSRF.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Apply egress blocking for internal and metadata ranges and, if the
        feature is non-essential, disable the URL-fetch option on the form.
      short_term_fix: >-
        Enforce a destination allow-list and resolved-IP checks in the handler
        for this field; prefer accepting an uploaded file over fetching a
        user-supplied URL.
      long_term_hardening: >-
        Move all URL fetching behind the shared SSRF-safe client and an
        egress proxy; review every form field that accepts URLs.
      code_fix_examples:
        python: >-
          Pass the submitted URL through the same allow-list + resolved-IP
          validator used everywhere, with redirects disabled, before fetching.
        node: Reuse a single validated-fetch helper; never call fetch(req.body.url) directly.
      config_examples: {}
    compensating_controls:
      - Egress firewall and metadata protections
      - Rate limiting and authentication on the fetching feature
    verification: >-
      Submit an internal-range URL and a harmless external marker through the
      form and confirm both are rejected before any outbound request is made.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
      - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    tags: [ssrf, forms, owasp-a10]

  - key: ssrf.headers
    kind: vulnerability
    aliases:
      - SSRF via Headers
    category: ssrf
    cwe: CWE-918
    owasp: "A10:2021-Server-Side Request Forgery"
    severity_guidance: >-
      High by default. Raise to Critical when internal destinations are
      reachable; lower to Medium when the header is only honoured by an edge
      component with restricted egress.
    exploitability: >-
      Medium — requires control of request headers (e.g. forwarded-host or
      custom URL headers) that a backend or proxy uses to build outbound URLs.
    business_impact: >-
      Internal service access through infrastructure components (proxies,
      analytics, or webhook handlers) that are often overlooked in reviews.
    why_it_matters: >-
      A backend component builds an outbound request from a client-supplied
      header value instead of from trusted configuration.
    detection_signal: >-
      A value supplied in a request header resulted in a server-originated
      request to that destination.
    false_positive_check: >-
      Confirm which component made the outbound request (application, reverse
      proxy, or third-party service) and that the header value — not a
      configured upstream — determined the destination.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Strip or overwrite untrusted forwarding and URL headers at the edge
        proxy, and apply egress blocking for internal and metadata ranges.
      short_term_fix: >-
        Build outbound URLs only from server-side configuration; if a header
        must be honoured, validate it against an allow-list of known hosts.
      long_term_hardening: >-
        Define which headers are trusted and from which hops (trusted-proxy
        list), and include header-driven fetches in threat modelling.
      code_fix_examples:
        python: >-
          Derive callback/base URLs from settings, not request.headers; if a
          forwarded host is required, accept it only from configured trusted
          proxy IPs and check it against an allow-list.
      config_examples:
        nginx: >-
          proxy_set_header Host $host; and explicitly clear or overwrite
          X-Forwarded-Host and similar headers received from clients.
    compensating_controls:
      - Edge proxy normalizing forwarding headers
      - Egress firewall and metadata protections
    verification: >-
      Send the header with a harmless external marker and an internal-range
      value and confirm no outbound request is made and the header is ignored
      or rejected.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/19-Testing_for_Server-Side_Request_Forgery
    tags: [ssrf, headers, owasp-a10]

  - key: ssrf.potential_parameter
    kind: vulnerability
    aliases:
      - Potential SSRF Parameter
    category: ssrf
    cwe: CWE-918
    owasp: "A10:2021-Server-Side Request Forgery"
    severity_guidance: >-
      Medium — a lead, not a confirmed flaw. Escalate to ssrf.confirmed only
      when a server-originated request is observed; downgrade to Low if the
      parameter is shown never to trigger a fetch.
    exploitability: >-
      Low until confirmed — the parameter's name or value looks like a URL or
      host, but no server-side request has been observed.
    business_impact: >-
      Potential internal access if the parameter is later confirmed to drive a
      server-side fetch.
    why_it_matters: >-
      Parameters that carry URLs or hostnames are the usual entry point for
      SSRF and deserve review even before a request is proven.
    detection_signal: >-
      A parameter whose name or value suggests a URL, host, path, or callback
      destination was observed on the endpoint.
    false_positive_check: >-
      Review the handler: if the value is only stored, displayed, or used for
      client-side navigation (no server fetch), close as not applicable; if
      the server fetches it, test with a harmless out-of-band marker.
    triage_priority: P3
    remediation:
      immediate_mitigation: No emergency action — confirm whether the parameter triggers a server-side fetch.
      short_term_fix: >-
        If the server fetches the value, apply the ssrf.confirmed controls
        (destination allow-list, resolved-IP checks, redirects disabled).
      long_term_hardening: >-
        Inventory URL-accepting parameters and route every server-side fetch
        through the shared SSRF-safe client.
      code_fix_examples: {}
      config_examples: {}
    compensating_controls:
      - Egress firewall denying internal and metadata ranges
    verification: >-
      Confirm in code review or with a harmless out-of-band marker that the
      parameter either never triggers a fetch or is restricted to allowed
      destinations.
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    tags: [ssrf, lead, needs-verification]

  # --- RCE / injection / deserialization (remediation only) -----------------
  - key: rce.command_injection
    kind: vulnerability
    aliases:
      - Command Injection
    category: rce
    cwe: CWE-78
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      Critical by default. Remains Critical when authentication is required,
      because server-level code execution affects every tenant and system the
      host can reach; lower to High only if the process runs sandboxed with no
      network egress and no secrets on the host.
    exploitability: >-
      High — once user input reaches an OS command interpreter, abuse requires
      little skill and is widely documented.
    business_impact: >-
      Full compromise of the application host: data theft, service
      disruption, credential exposure, and a foothold for lateral movement.
    why_it_matters: >-
      User-controlled input is passed to an operating-system command
      interpreter, so the input can change which commands the server runs.
    detection_signal: >-
      A benign, uniquely identifiable marker supplied in a parameter produced
      a server-side behaviour or timing difference consistent with the value
      being interpreted by a command shell.
    false_positive_check: >-
      Confirm the difference reproduces consistently with the specific
      parameter and does not occur with an ordinary value; rule out generic
      application errors, rate limiting, and network jitter by repeating the
      benign comparison several times.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Take the affected endpoint offline or block it with a WAF/virtual
        patch, review host logs for signs of prior abuse, and rotate any
        credentials stored on or reachable from the host.
      short_term_fix: >-
        Remove shell invocation on user input: call the underlying library or
        API directly instead of a shell command; if a process must be started,
        pass arguments as a list without a shell and validate each argument
        against a strict allow-list of expected values.
      long_term_hardening: >-
        Run the service as a least-privilege user in a restricted container
        (read-only filesystem, no unnecessary binaries, restricted egress),
        adopt a shared input-validation layer, and add SAST rules that block
        shell-invoking APIs in code review.
      code_fix_examples:
        python: >-
          Prefer a native library over running a tool. If a process is
          required, use subprocess.run([binary, validated_arg], shell=False,
          check=True, timeout=...) with arguments as a list and each value
          checked against an allow-list.
        node: >-
          Use child_process.execFile / spawn with an argument array and no
          shell option; validate arguments against an allow-list; never build a
          command string from request data.
        java: >-
          Use ProcessBuilder with a fixed executable and a list of validated
          arguments; do not pass user input to a shell interpreter.
        php: >-
          Replace shell calls with native PHP functions; if unavoidable, use
          proc_open with an argument array and validate every argument against
          an allow-list.
      config_examples:
        php: >-
          Disable unused process-execution functions via disable_functions in
          php.ini for applications that do not need them.
        container: >-
          Run as a non-root user with a read-only root filesystem and a minimal
          base image that omits shells and utilities the app does not use.
    compensating_controls:
      - WAF / virtual patch on the affected endpoint
      - Least-privilege, sandboxed runtime with restricted egress
      - Host-based detection and alerting on unexpected child processes
    verification: >-
      Re-run the platform's check with the same benign marker and confirm no
      behaviour or timing difference remains; confirm in code review that the
      handler no longer invokes a shell with request data.
    references:
      - https://owasp.org/Top10/A03_2021-Injection/
      - https://cwe.mitre.org/data/definitions/78.html
      - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/12-Testing_for_Command_Injection
    tags: [rce, injection, os-command, owasp-a03]

  - key: rce.ssti
    kind: vulnerability
    aliases:
      - Server-Side Template Injection (SSTI)
    category: rce
    cwe: CWE-1336
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      Critical by default, since template engines commonly allow code
      execution; lower to High only when the engine is confirmed to be a
      logic-less/sandboxed engine and no sensitive objects are in context.
    exploitability: >-
      High — engine-specific techniques are publicly known once user input
      reaches template source.
    business_impact: >-
      Server-side code execution, secret disclosure from the template context,
      and full application compromise.
    why_it_matters: >-
      User input is concatenated into the template source itself rather than
      being passed to the template as data, so the engine evaluates it.
    detection_signal: >-
      A benign marker in a parameter was evaluated by the template engine
      (its output differs from the literal input) instead of being rendered as
      plain text.
    false_positive_check: >-
      Confirm the transformed output comes from server-side template
      evaluation (not client-side rendering or a documented formatting
      feature) and reproduces for the specific parameter.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Disable the affected feature or block the parameter with a WAF rule,
        and rotate secrets that were available in the rendering context.
      short_term_fix: >-
        Never build templates from user input: load templates from files or
        constants and pass user values only as context variables. If users
        must author templates, use a logic-less engine or the engine's
        sandboxed environment with a minimal context.
      long_term_hardening: >-
        Standardize template loading in one helper, forbid rendering from
        request-derived strings via lint/SAST rules, and run the service with
        least privilege.
      code_fix_examples:
        python: >-
          Jinja2: env.get_template("page.html").render(name=user_value) — pass
          input as data; for user-authored templates use
          jinja2.sandbox.SandboxedEnvironment with a minimal context.
        node: >-
          Compile templates from files at startup and render with a data
          object; never compile a template string built from request data.
        java: >-
          Thymeleaf/FreeMarker: load templates from the classpath and supply
          user input via the model; enable the engine's restricted class
          resolution for any user-editable templates.
        php: >-
          Twig: render file-based templates with an array of variables; enable
          the Twig sandbox extension for user-authored templates.
      config_examples: {}
    compensating_controls:
      - WAF rule on the affected parameter
      - Minimal template context (no access to configuration or OS objects)
    verification: >-
      Re-submit the same benign marker and confirm it is rendered literally as
      text; confirm in code review that templates are no longer built from
      request data.
    references:
      - https://owasp.org/Top10/A03_2021-Injection/
      - https://cwe.mitre.org/data/definitions/1336.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/18-Testing_for_Server-side_Template_Injection
    tags: [rce, ssti, injection, owasp-a03]

  - key: rce.web_shell
    kind: vulnerability
    aliases:
      - Web Shell Found
    category: rce
    cwe: CWE-506
    owasp: "A08:2021-Software and Data Integrity Failures"
    severity_guidance: >-
      Critical — treat as an active compromise until proven otherwise; never
      downgrade without an incident-response review.
    exploitability: >-
      High — a web shell is, by definition, an attacker-placed remote access
      mechanism that is already present.
    business_impact: >-
      Existing unauthorized control of the server, with likely data access,
      persistence, and lateral movement already under way.
    why_it_matters: >-
      A file that provides remote command access through the web server was
      found. Its presence indicates a prior compromise, not a theoretical risk.
    detection_signal: >-
      A file matching known web-shell characteristics was found reachable in
      the web root.
    false_positive_check: >-
      Have the system owner confirm whether the file is a known, authorized
      administration tool; compare its hash and timestamps with deployment
      artifacts and version control. Treat as genuine until this is confirmed.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Start incident response: isolate the host (block inbound access to the
        file and restrict network egress), preserve evidence (disk image or
        file copies, web and system logs) before removing anything, and rotate
        all credentials, keys, and tokens present on or used by the host.
      short_term_fix: >-
        Eradicate: remove the web shell and any other unauthorized files,
        identify and close the initial entry point (vulnerable upload, plugin,
        or injection), and rebuild the host from a known-good image where the
        extent of compromise is uncertain.
      long_term_hardening: >-
        Hunt for persistence (scheduled tasks, new accounts, modified
        binaries), deploy file-integrity monitoring on the web root, make the
        web root read-only for the runtime user, and block execution in upload
        directories.
      code_fix_examples: {}
      config_examples:
        nginx: >-
          Deny script execution in upload locations (serve them as static
          files only) and restrict the web root to the files you deploy.
        apache: >-
          Disable script handlers in upload directories and set
          AllowOverride None where .htaccess is not required.
    compensating_controls:
      - Host isolation and egress restriction during investigation
      - File-integrity monitoring on the web root
      - EDR / host-based detection on the server
    verification: >-
      Confirm the file is gone, the web root matches the deployed release
      (hash comparison), file-integrity monitoring is active, and the platform
      scan no longer reports the finding; record IR closure.
    references:
      - https://cwe.mitre.org/data/definitions/506.html
      - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
      - https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
    tags: [rce, web-shell, incident-response, compromise]

  - key: rce.php_deserialization
    kind: vulnerability
    aliases:
      - PHP Serialization Data Found
    category: rce
    cwe: CWE-502
    owasp: "A08:2021-Software and Data Integrity Failures"
    severity_guidance: >-
      High by default. Raise to Critical if the serialized value is accepted
      back from the client and deserialized server-side; lower to Medium if it
      is only emitted and never read back.
    exploitability: >-
      Medium — depends on whether the application deserializes the
      client-returned value and which classes are loaded.
    business_impact: >-
      Potential server-side code execution or object tampering (e.g.
      privilege fields) if the value is deserialized from client input.
    why_it_matters: >-
      Native PHP serialized objects are exchanged with the client. If the
      server later unserializes client-supplied data, the client controls
      which objects are created.
    detection_signal: >-
      A cookie, parameter, or response body contains data in PHP's native
      serialization format.
    false_positive_check: >-
      Determine whether the server passes this value back to unserialize():
      check the handling code, or confirm the value is signed/encrypted and
      verified before use. Data emitted only for display is lower risk.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        If the value is read back server-side, sign it with a server-side MAC
        and reject unsigned or modified values; review logs for unexpected
        values in this field and move to incident response if tampering is
        found.
      short_term_fix: >-
        Stop exchanging native serialized objects with clients: use JSON with
        schema validation, or store the state server-side and send only an
        opaque identifier.
      long_term_hardening: >-
        Ban unserialize() on external input via static analysis, keep
        dependencies current, and run with least privilege.
      code_fix_examples:
        php: >-
          Use json_encode/json_decode with explicit validation of the decoded
          structure; where unserialize() is unavoidable on trusted data, pass
          ['allowed_classes' => false] (or an explicit allow-list).
      config_examples: {}
    compensating_controls:
      - HMAC-signed values verified before use
      - WAF rule blocking serialized-object patterns in the affected field
    verification: >-
      Confirm the field now carries JSON or an opaque server-side reference,
      and that modified values are rejected; re-scan to confirm the finding
      is gone.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
      - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    tags: [deserialization, php, integrity, owasp-a08]

  - key: rce.python_pickle
    kind: vulnerability
    aliases:
      - Python Pickle Data Found
    category: rce
    cwe: CWE-502
    owasp: "A08:2021-Software and Data Integrity Failures"
    severity_guidance: >-
      High by default. Raise to Critical if the pickled value is accepted back
      from the client and unpickled server-side (pickle loading is inherently
      code execution); lower to Medium if it is never read back.
    exploitability: >-
      High when client-supplied data is unpickled — the format can execute
      code on load by design.
    business_impact: >-
      Server-side code execution and full application compromise if the value
      is unpickled from client input.
    why_it_matters: >-
      Python pickle data is exchanged with the client. Loading pickle data is
      equivalent to running code, so it must never come from an untrusted
      source.
    detection_signal: >-
      A cookie, parameter, or response body contains data in Python's pickle
      serialization format.
    false_positive_check: >-
      Determine whether the server calls a pickle loader on this value;
      confirm whether it is signed and verified before loading. Values only
      produced by the server and never read back are lower risk.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        If the value is read back server-side, stop accepting it (invalidate
        and re-issue the state server-side); review logs for unexpected values
        and move to incident response if tampering is found.
      short_term_fix: >-
        Replace pickle with JSON (plus schema validation) for anything that
        crosses a trust boundary, or keep the state server-side and send only
        an opaque, signed identifier.
      long_term_hardening: >-
        Ban pickle.loads / yaml.load (non-safe) on external input via static
        analysis (e.g. Bandit rules), and run with least privilege.
      code_fix_examples:
        python: >-
          Use json.dumps/json.loads with schema validation (e.g. pydantic);
          for signed client state use itsdangerous with a JSON serializer; use
          yaml.safe_load, never yaml.load, for YAML.
      config_examples: {}
    compensating_controls:
      - Server-side session storage with opaque identifiers
      - Signed values verified before any processing
    verification: >-
      Confirm the field no longer contains pickle data, modified values are
      rejected, and static analysis reports no pickle loads on external input.
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
      - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    tags: [deserialization, python, integrity, owasp-a08]

  # --- Auth & session: cookies, session lifecycle, passwords ----------------
  - key: auth_session.cookie_missing_httponly
    kind: vulnerability
    aliases:
      - Session Cookie Missing HttpOnly Flag
    category: auth_session
    cwe: CWE-1004
    owasp: "A07:2021-Identification and Authentication Failures"
    severity_guidance: >-
      Medium by default. Raise to High when the site also has XSS; lower to
      Low if the cookie is not a session or authentication cookie.
    exploitability: >-
      Low alone — it only matters when combined with a script-injection flaw,
      which then lets scripts read the session token.
    business_impact: >-
      Turns any XSS into full session hijacking by exposing the session token
      to page scripts.
    why_it_matters: >-
      Without HttpOnly, JavaScript running on the page can read the session
      cookie, so one XSS bug is enough to steal user sessions.
    detection_signal: >-
      A Set-Cookie header for a session or authentication cookie lacks the
      HttpOnly attribute.
    false_positive_check: >-
      Confirm the cookie actually carries a session or auth token (not a UI
      preference) and that the attribute is missing on the production
      response, including after login.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Add HttpOnly to the session cookie at the reverse proxy if the
        application cannot be redeployed immediately.
      short_term_fix: >-
        Set HttpOnly (together with Secure and SameSite) on every session and
        authentication cookie in the framework's session configuration.
      long_term_hardening: >-
        Keep cookie attributes in shared configuration with a test that fails
        if a session cookie is issued without them.
      code_fix_examples:
        python: >-
          Django: SESSION_COOKIE_HTTPONLY = True. Flask:
          SESSION_COOKIE_HTTPONLY = True. FastAPI/Starlette:
          response.set_cookie(..., httponly=True, secure=True, samesite="lax").
        node: >-
          express-session: cookie: { httpOnly: true, secure: true, sameSite: 'lax' }.
        java: >-
          web.xml <cookie-config><http-only>true</http-only></cookie-config>,
          or Spring Boot server.servlet.session.cookie.http-only=true.
        php: >-
          session.cookie_httponly = 1 in php.ini, or
          session_set_cookie_params(['httponly' => true, ...]).
      config_examples:
        nginx: >-
          proxy_cookie_flags <cookie_name> httponly secure samesite=lax;
          (nginx 1.19.3+) as an interim edge fix.
    compensating_controls:
      - Strict Content-Security-Policy to reduce XSS risk
      - Short session lifetime
    verification: >-
      Log in and inspect the Set-Cookie header: the session cookie carries
      HttpOnly; document.cookie in the browser console no longer shows it.
    references:
      - https://cwe.mitre.org/data/definitions/1004.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/02-Testing_for_Cookies_Attributes
    tags: [session, cookies, owasp-a07]

  - key: auth_session.cookie_missing_secure
    kind: vulnerability
    aliases:
      - Session Cookie Missing Secure Flag
    category: auth_session
    cwe: CWE-614
    owasp: "A02:2021-Cryptographic Failures"
    severity_guidance: >-
      Medium by default. Raise to High if the site is reachable over plain
      HTTP or lacks HSTS; lower to Low for non-session cookies.
    exploitability: >-
      Medium — requires the victim's browser to send a request over plain
      HTTP on a network the attacker can observe.
    business_impact: >-
      Session tokens can leak over unencrypted connections, allowing session
      takeover on untrusted networks.
    why_it_matters: >-
      Without the Secure attribute, the browser will send the session cookie
      over plain HTTP if any HTTP request to the domain is made.
    detection_signal: >-
      A Set-Cookie header for a session or authentication cookie lacks the
      Secure attribute on an HTTPS site.
    false_positive_check: >-
      Confirm the site is served over HTTPS in production and the cookie is a
      session/auth cookie; on an HTTP-only development host the Secure flag is
      expected to be absent (a separate transport issue).
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Enable HSTS and add the Secure attribute at the edge proxy.
      short_term_fix: >-
        Set Secure on all session and authentication cookies in the
        framework's session configuration and serve the site only over HTTPS.
      long_term_hardening: >-
        Enforce HTTPS-only with HSTS (and preload where appropriate); use the
        __Host- cookie prefix for session cookies.
      code_fix_examples:
        python: >-
          Django: SESSION_COOKIE_SECURE = True, CSRF_COOKIE_SECURE = True.
          Flask: SESSION_COOKIE_SECURE = True.
        node: express-session cookie.secure = true (with app.set('trust proxy', 1) behind a TLS proxy).
        java: Spring Boot server.servlet.session.cookie.secure=true.
        php: session.cookie_secure = 1.
      config_examples:
        nginx: >-
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    compensating_controls:
      - HSTS on the whole domain
      - Redirect all HTTP to HTTPS at the edge
    verification: >-
      Inspect Set-Cookie after login and confirm Secure is present; confirm
      HSTS is returned on HTTPS responses.
    references:
      - https://cwe.mitre.org/data/definitions/614.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/02-Testing_for_Cookies_Attributes
    tags: [session, cookies, transport, owasp-a02]

  - key: auth_session.cookie_missing_samesite
    kind: vulnerability
    aliases:
      - Session Cookie Missing SameSite Attribute
    category: auth_session
    cwe: CWE-1275
    owasp: "A07:2021-Identification and Authentication Failures"
    severity_guidance: >-
      Low by default, because modern browsers default to Lax. Raise to Medium
      when state-changing requests lack CSRF tokens.
    exploitability: >-
      Low — relies on cross-site request forgery and on browsers or flows
      where the Lax default does not apply.
    business_impact: >-
      Weakens CSRF protection for authenticated actions.
    why_it_matters: >-
      SameSite tells the browser not to attach the session cookie to
      cross-site requests, which is an important CSRF defense layer.
    detection_signal: >-
      A Set-Cookie header for a session or authentication cookie has no
      SameSite attribute.
    false_positive_check: >-
      Confirm the cookie is session/auth related, and check whether CSRF
      tokens protect state-changing endpoints (which lowers the practical
      impact).
    triage_priority: P4
    remediation:
      immediate_mitigation: Add SameSite=Lax to the session cookie at the edge proxy.
      short_term_fix: >-
        Set SameSite=Lax (or Strict where cross-site navigation into
        authenticated pages is not needed) in the session configuration.
      long_term_hardening: >-
        Pair SameSite with CSRF tokens on all state-changing requests; review
        any cookie that genuinely needs SameSite=None.
      code_fix_examples:
        python: Django SESSION_COOKIE_SAMESITE = "Lax"; Flask SESSION_COOKIE_SAMESITE = "Lax".
        node: express-session cookie.sameSite = 'lax'.
        java: Spring Boot server.servlet.session.cookie.same-site=lax.
        php: session.cookie_samesite = "Lax".
      config_examples: {}
    compensating_controls:
      - CSRF tokens on all state-changing endpoints
    verification: >-
      Inspect Set-Cookie after login and confirm SameSite=Lax or Strict.
    references:
      - https://cwe.mitre.org/data/definitions/1275.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
    tags: [session, cookies, csrf, owasp-a07]

  - key: auth_session.session_id_persistence
    kind: vulnerability
    aliases:
      - Session ID Persistence
    category: auth_session
    cwe: CWE-384
    owasp: "A07:2021-Identification and Authentication Failures"
    severity_guidance: >-
      Medium by default. Raise to High when session identifiers can be set
      from the URL or by a subdomain; lower to Low if sessions are short-lived
      and bound to other factors.
    exploitability: >-
      Medium — requires the attacker to plant a known session identifier in
      the victim's browser before login.
    business_impact: >-
      Session fixation allows taking over the victim's account after they log
      in with a pre-set session identifier.
    why_it_matters: >-
      The session identifier issued before login is still valid after login,
      so anyone who knew it beforehand shares the authenticated session.
    detection_signal: >-
      The session identifier observed before authentication is unchanged
      after a successful login.
    false_positive_check: >-
      Compare the session cookie value before and after login on a test
      account; confirm the same value is accepted as authenticated (some
      frameworks rotate a second cookie that actually carries the session).
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Invalidate existing sessions on login at the application layer if a
        configuration switch exists; shorten session lifetime.
      short_term_fix: >-
        Regenerate the session identifier on every privilege change (login,
        logout, role change) and invalidate the old one; reject session IDs
        supplied in URLs.
      long_term_hardening: >-
        Use the framework's built-in session management, set idle and absolute
        timeouts, and rotate identifiers periodically.
      code_fix_examples:
        python: >-
          Django's login() rotates the session key automatically — do not
          bypass it; Flask: clear the session and issue a new one on login.
        node: Call req.session.regenerate() after successful authentication.
        java: Call request.changeSessionId() (Servlet 3.1+) after login; Spring Security's sessionFixation().migrateSession() does this by default.
        php: Call session_regenerate_id(true) immediately after login.
      config_examples:
        php: session.use_strict_mode = 1 and session.use_only_cookies = 1.
    compensating_controls:
      - Short idle and absolute session timeouts
      - Binding sessions to additional context (e.g. re-auth for sensitive actions)
    verification: >-
      Log in with a test account and confirm the session identifier changes
      and the pre-login identifier is no longer accepted.
    references:
      - https://cwe.mitre.org/data/definitions/384.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/03-Testing_for_Session_Fixation
    tags: [session, fixation, owasp-a07]

  - key: auth_session.weak_password_accepted
    kind: vulnerability
    aliases:
      - Weak Password Accepted
    category: auth_session
    cwe: CWE-521
    owasp: "A07:2021-Identification and Authentication Failures"
    severity_guidance: >-
      High by default for internet-facing login. Lower to Medium when MFA is
      enforced for all users or when rate limiting and lockout are in place.
    exploitability: >-
      High — weak or common passwords are routinely guessed with automated
      tooling against exposed logins.
    business_impact: >-
      Account takeover of users who chose weak passwords, including
      privileged accounts.
    why_it_matters: >-
      The application accepted a password that appears on common-password
      lists or is too short, so accounts can be guessed.
    detection_signal: >-
      Registration or password change accepted a short or commonly used
      password.
    false_positive_check: >-
      Confirm on a test account that the weak password was actually saved and
      usable for login (not rejected at a later step or on first login).
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Enable rate limiting and temporary lockout on login; require MFA for
        administrative accounts.
      short_term_fix: >-
        Enforce a minimum length (at least 12 characters is common current
        guidance), check new passwords against a breached-password list, and
        reject passwords that match.
      long_term_hardening: >-
        Offer MFA to all users, encourage password managers, and avoid
        composition rules that push users to predictable patterns.
      code_fix_examples:
        python: >-
          Django: AUTH_PASSWORD_VALIDATORS with MinimumLengthValidator
          (min_length=12) and CommonPasswordValidator.
        node: Validate length server-side and check against a breached-password dataset (k-anonymity API or offline list).
        java: Spring Security / Passay password rules with a minimum length and dictionary check.
        php: Laravel Password::min(12)->uncompromised().
      config_examples: {}
    compensating_controls:
      - Login rate limiting and lockout
      - MFA for privileged accounts
    verification: >-
      Attempt to set a short or common password on a test account and confirm
      it is rejected with a clear message.
    references:
      - https://cwe.mitre.org/data/definitions/521.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/04-Authentication_Testing/07-Testing_for_Weak_Password_Policy
    tags: [authentication, passwords, owasp-a07]

  - key: auth_session.weak_password_policy
    kind: vulnerability
    aliases:
      - Weak Password Policy
    category: auth_session
    cwe: CWE-521
    owasp: "A07:2021-Identification and Authentication Failures"
    severity_guidance: >-
      Medium by default. Raise to High when no rate limiting or MFA exists;
      lower to Low when MFA is mandatory.
    exploitability: >-
      Medium — a lax policy increases the share of guessable passwords over
      time.
    business_impact: >-
      Higher likelihood of account takeover across the user base.
    why_it_matters: >-
      The stated or enforced password rules allow short or common passwords.
    detection_signal: >-
      The password policy (messages or validation behaviour) permits short or
      common passwords.
    false_positive_check: >-
      Confirm the policy observed is the one enforced server-side (client-side
      hints alone do not prove the server accepts weak passwords).
    triage_priority: P3
    remediation:
      immediate_mitigation: Enable login rate limiting and lockout.
      short_term_fix: >-
        Enforce minimum length and breached-password checks server-side.
      long_term_hardening: >-
        Adopt current password guidance (length over complexity, no forced
        periodic rotation without cause) and roll out MFA.
      code_fix_examples:
        python: Configure Django AUTH_PASSWORD_VALIDATORS (length + common-password checks).
        php: Laravel Password::min(12)->uncompromised().
      config_examples: {}
    compensating_controls:
      - MFA
      - Rate limiting and lockout
    verification: >-
      Confirm weak passwords are rejected server-side on registration and
      password change.
    references:
      - https://cwe.mitre.org/data/definitions/521.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
    tags: [authentication, passwords, policy, owasp-a07]

  - key: auth_session.missing_mfa
    kind: vulnerability
    aliases:
      - Missing MFA
    category: auth_session
    cwe: CWE-308
    owasp: "A07:2021-Identification and Authentication Failures"
    severity_guidance: >-
      Medium by default. Raise to High for administrative or financial
      functions; lower to Low for low-value, non-sensitive accounts.
    exploitability: >-
      Medium — only a password stands between a phished or reused credential
      and the account.
    business_impact: >-
      Credential phishing and password reuse lead directly to account
      takeover.
    why_it_matters: >-
      Without a second factor, any leaked or guessed password is sufficient to
      access the account.
    detection_signal: >-
      The login flow completes with a password only, and no MFA enrolment or
      step-up option is offered.
    false_positive_check: >-
      Confirm MFA is not available (not merely optional for the test
      account) and not enforced by an upstream SSO provider.
    triage_priority: P3
    remediation:
      immediate_mitigation: Require MFA for administrator accounts first.
      short_term_fix: >-
        Offer TOTP or WebAuthn-based MFA to all users and enforce it for
        privileged roles; require step-up authentication for sensitive actions.
      long_term_hardening: >-
        Move toward phishing-resistant authentication (passkeys / WebAuthn)
        and centralize authentication through an identity provider.
      code_fix_examples:
        python: Use a maintained TOTP/WebAuthn library (e.g. pyotp, py_webauthn) and store secrets encrypted.
        node: Use a maintained TOTP/WebAuthn library (e.g. otplib, @simplewebauthn/server).
        java: Use Spring Security's MFA support or a maintained WebAuthn library.
        php: Use a maintained TOTP library or the framework's two-factor package.
      config_examples: {}
    compensating_controls:
      - Login anomaly detection and alerting
      - Rate limiting and lockout
    verification: >-
      Confirm MFA enrolment is available, enforced for privileged roles, and
      required again for sensitive actions.
    references:
      - https://cwe.mitre.org/data/definitions/308.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html
    tags: [authentication, mfa, owasp-a07]

  - key: auth_session.password_reset_enumeration
    kind: vulnerability
    aliases:
      - Password Reset Enumeration
    category: auth_session
    cwe: CWE-640
    owasp: "A07:2021-Identification and Authentication Failures"
    severity_guidance: >-
      Medium by default (the account-existence disclosure is also CWE-204).
      Raise to High where account existence is itself sensitive; lower to Low
      if registration publicly reveals usernames anyway.
    exploitability: >-
      Medium — enables building lists of valid accounts for later credential
      attacks.
    business_impact: >-
      Discloses which users have accounts and feeds targeted phishing and
      password-guessing.
    why_it_matters: >-
      The reset flow responds differently for existing and non-existing
      accounts, revealing who is registered.
    detection_signal: >-
      The password-reset response (message, status, or timing) differs
      consistently between a known test account and a non-existent address.
    false_positive_check: >-
      Confirm the difference is consistent across repeated harmless requests
      using your own test account versus a clearly non-existent address, and
      is not caused by rate limiting or caching.
    triage_priority: P3
    remediation:
      immediate_mitigation: Rate limit the password-reset endpoint per IP and per account.
      short_term_fix: >-
        Return the same generic message and status for every request ("If an
        account exists, you will receive an email") and equalize response
        timing by processing the email asynchronously.
      long_term_hardening: >-
        Use short-lived, single-use, high-entropy reset tokens and notify the
        account owner of reset requests.
      code_fix_examples:
        python: Queue the reset email in a background task and always return the same response body.
        node: Respond immediately with a generic message; send the email via a job queue.
        java: Return a uniform response and move email dispatch to an async executor.
        php: Return a uniform response and dispatch the email through a queued job.
      config_examples: {}
    compensating_controls:
      - Rate limiting and CAPTCHA on the reset form
    verification: >-
      Submit reset requests for your own test account and a non-existent
      address and confirm the responses are indistinguishable.
    references:
      - https://cwe.mitre.org/data/definitions/640.html
      - https://cwe.mitre.org/data/definitions/204.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/03-Identity_Management_Testing/04-Testing_for_Account_Enumeration_and_Guessable_User_Account
    tags: [authentication, enumeration, password-reset, owasp-a07]

