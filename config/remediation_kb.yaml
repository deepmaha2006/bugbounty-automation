      redirect URIs, state, or token handling are misconfigured.
    detection_signal: >-
      An OAuth or OpenID Connect authorization/token endpoint or discovery
      document was observed.
    false_positive_check: >-
      Confirm the endpoint belongs to the application or its identity
      provider and is in scope.
    triage_priority: P4
    remediation:
      immediate_mitigation: No action required — this is an observation.
      short_term_fix: >-
        Verify: confirm redirect URIs are exact-match allow-listed, the state
        parameter (and PKCE for public clients) is enforced, and scopes are
        minimal.
      long_term_hardening: >-
        Monitor: include the OAuth configuration in periodic reviews and keep
        client secrets in a secrets manager with rotation.
      code_fix_examples: {}
      config_examples: {}
    compensating_controls:
