  # ---------- clickjack ----------

  - key: clickjack.missing_protection
    kind: vulnerability
    aliases:
      - "Missing Clickjacking Protection"
    category: clickjack
    cwe: CWE-1021
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High when sensitive/state-changing pages can be framed (no frame protections),
      enabling clickjacking. Lower for purely informational pages.
    exploitability: >-
      Medium. Requires framing the page and luring interaction.
    business_impact: >-
      Tricking users into unintended actions (UI redress) on sensitive pages.
    why_it_matters: >-
      Without frame protections, pages can be overlaid and clicks hijacked.
    detection_signal: >-
      A sensitive page lacks frame-ancestors CSP and X-Frame-Options and can be
      framed.
    false_positive_check: >-
      Confirm the page is sensitive and genuinely framable (no CSP frame-ancestors
      or XFO).
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Add Content-Security-Policy frame-ancestors 'none' (or an allowlist) and
        X-Frame-Options DENY/SAMEORIGIN.
      short_term_fix: >-
        Apply frame protections across sensitive pages via server/middleware.
      long_term_hardening: >-
        Baseline security headers site-wide (correlates into the hardening gap).
      code_fix_examples: {}
      config_examples:
        nginx: >-
          add_header Content-Security-Policy "frame-ancestors 'none'"; add_header X-Frame-Options DENY;
    verification: >-
      Confirm the page cannot be framed after the headers are applied.
    compensating_controls:
      - "Baseline security headers"
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/1021.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sheet.html"
    tags: ["clickjacking", "headers", "frame"]

  - key: clickjack.weak_protection
    kind: vulnerability
    aliases:
      - "Weak Clickjacking Protection"
    category: clickjack
    cwe: CWE-1021
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Medium when frame protection exists but is weak (e.g. only legacy XFO with
      permissive settings, or a broad frame-ancestors allowlist). Lower if
      protection is adequate for the page's sensitivity.
    exploitability: >-
      Medium. Depends on how permissive the framing policy is.
    business_impact: >-
      Residual clickjacking exposure for sensitive pages.
    why_it_matters: >-
      Partial or legacy-only protection may not cover modern browsers or all
      framing.
    detection_signal: >-
      Frame protection is present but permissive or relies only on deprecated
      mechanisms.
    false_positive_check: >-
      Confirm the policy is actually too permissive for the page's sensitivity.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Tighten frame-ancestors to 'none' or a strict allowlist; keep XFO as a
        legacy fallback.
      short_term_fix: >-
        Standardize a strict framing policy on sensitive pages.
      long_term_hardening: >-
        Enforce the header baseline and review framing policies periodically.
      code_fix_examples: {}
      config_examples: {}
    verification: >-
      Confirm the page cannot be framed by disallowed origins after tightening.
    compensating_controls:
      - "Strict frame-ancestors CSP"
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/1021.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sheet.html"
    tags: ["clickjacking", "headers", "frame"]

