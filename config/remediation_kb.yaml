  # ---------- llm ----------

  - key: llm.prompt_injection
    kind: vulnerability
    aliases:
      - "LLM Prompt Injection"
    category: llm
    cwe: CWE-1427
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      Critical when untrusted input can override system instructions and the model
      can trigger sensitive actions or reach sensitive data/tools. Lower if the
      model is sandboxed with no sensitive capabilities or data.
    exploitability: >-
      Medium. Depends on how much authority and data the model has.
    business_impact: >-
      Unauthorized actions, data disclosure, or misuse via manipulated model
      behavior.
    why_it_matters: >-
      Models that mix untrusted input with instructions and privileged tools can be
      steered to unintended actions.
    detection_signal: >-
      Untrusted input appears able to change the model's behavior against its
      intended instructions in a benign probe.
    false_positive_check: >-
      Confirm the behavior change is due to injected instructions, not normal task
      variation.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Constrain the model's capabilities and data access; require human approval
        for sensitive actions.
      short_term_fix: >-
        Separate trusted instructions from untrusted content, apply input/output
        filtering, and least-privilege tool access with allowlists.
      long_term_hardening: >-
        Enforce per-action authorization outside the model, sandbox tools, log and
        review model actions, and test against injection patterns.
      code_fix_examples: {}
      config_examples: {}
    verification: >-
      Re-run the benign probe after mitigations and confirm the model no longer
      deviates from its intended instructions or reaches restricted actions.
    compensating_controls:
      - "Human-in-the-loop for sensitive actions"
      - "Least-privilege tool/data access outside the model"
    references:
      - "https://genai.owasp.org/llm-top-10/"
      - "https://cwe.mitre.org/data/definitions/1427.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["llm", "prompt-injection", "ai-security"]

  - key: llm.prompt_leakage
    kind: vulnerability
    aliases:
      - "LLM Prompt Leakage"
    category: llm
    cwe: CWE-200
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      High when system prompts reveal secrets, keys, or sensitive logic. Lower to
      Medium if the disclosed prompt is non-sensitive.
    exploitability: >-
      Medium. Requires eliciting the system prompt/instructions.
    business_impact: >-
      Disclosure of embedded secrets or logic that aids further attacks.
    why_it_matters: >-
      Secrets or sensitive rules embedded in prompts can be surfaced to users.
    detection_signal: >-
      The model discloses its system instructions or embedded configuration.
    false_positive_check: >-
      Confirm the disclosed content is actually the system prompt/secret rather than
      generic text.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Remove secrets/keys from prompts; store them server-side and reference via
        controlled tools.
      short_term_fix: >-
        Keep sensitive logic and credentials out of prompts; apply output filtering.
      long_term_hardening: >-
        Treat prompts as non-secret; manage secrets in a vault and enforce tool-level
        authorization.
      code_fix_examples: {}
      config_examples: {}
    verification: >-
      Confirm the model no longer reveals secrets and that no credentials remain in
      prompts.
    compensating_controls:
      - "Secrets in a vault, not prompts"
      - "Output filtering"
    references:
      - "https://genai.owasp.org/llm-top-10/"
      - "https://cwe.mitre.org/data/definitions/200.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
    tags: ["llm", "prompt-leakage", "secrets"]

