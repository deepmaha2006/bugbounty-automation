  # ---------- websocket ----------

  - key: websocket.missing_authentication
    kind: vulnerability
    aliases:
      - "WebSocket Missing Authentication"
    category: websocket
    cwe: CWE-306
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      High when a WebSocket handling sensitive data/actions accepts connections
      without authentication/authorization. Lower if it only serves public,
      non-sensitive data.
    exploitability: >-
      Medium. Requires connecting to the WebSocket endpoint.
    business_impact: >-
      Unauthorized access to real-time data or actions over the socket.
    why_it_matters: >-
      WebSockets need the same authn/authz as HTTP endpoints, which is easy to miss.
    detection_signal: >-
      A WebSocket accepts connections and messages without authenticating the
      client.
    false_positive_check: >-
      Confirm the socket exposes sensitive data/actions and truly performs no
      authentication.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Require authentication on the WebSocket handshake (token/session) and
        authorize each action.
      short_term_fix: >-
        Validate origin, authenticate at connect, and enforce per-message
        authorization.
      long_term_hardening: >-
        Standardize WebSocket auth middleware and add tests for unauthenticated
        rejection.
      code_fix_examples:
        node: >-
          Verify a session/token during the upgrade/handshake and reject
          unauthenticated connections; check authorization per message.
        python: >-
          Authenticate on connect (token in the handshake) and enforce authz on each
          received event.
      config_examples: {}
    verification: >-
      Confirm an unauthenticated connection/message is rejected after the fix.
    compensating_controls:
      - "Origin validation"
      - "Gateway authentication for WebSockets"
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/306.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["websocket", "authentication", "authorization"]

