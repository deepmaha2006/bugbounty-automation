    tags: ["connection-limiting", "availability"]

  - key: ddos.large_payload_accepted
    kind: vulnerability
    aliases:
      - "Large Payload Accepted"
    category: ddos
    cwe: CWE-400
    owasp: "A04:2021-Insecure Design"
    severity_guidance: >-
      Low by default; raise to Medium if oversized bodies can exhaust memory/CPU or
      reach an expensive parser.
    exploitability: >-
      Medium. Sending an oversized request body.
    business_impact: >-
      Memory/CPU exhaustion and degraded availability.
    why_it_matters: >-
      Accepting unbounded request bodies enables resource-exhaustion attacks.
    detection_signal: >-
      The server accepts a request body far larger than the endpoint needs.
    false_positive_check: >-
      Confirm the endpoint has no legitimate need for large bodies and lacks a size
      cap.
    triage_priority: P4
    remediation:
      immediate_mitigation: >-
        Set a maximum request body size at the edge/proxy for the endpoint.
