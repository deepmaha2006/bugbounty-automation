    tags: ["cloud", "gcp", "credentials", "incident"]

  - key: cloud.kubernetes_api_exposure
    kind: vulnerability
    aliases:
      - "Kubernetes API Exposure"
    category: cloud
    cwe: CWE-306
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Critical when the Kubernetes API is reachable without proper authentication/
      authorization. Lower if reachable but strong authn/authz and network
      restrictions are enforced.
    exploitability: >-
      High. An unauthenticated/weakly-authenticated API can expose cluster control.
    business_impact: >-
      Cluster compromise, workload tampering, and data access across namespaces.
    why_it_matters: >-
      An exposed control plane is among the highest-impact cloud-native
      misconfigurations.
    detection_signal: >-
      The Kubernetes API server is reachable and responds without requiring proper
      authentication.
    false_positive_check: >-
      Confirm the endpoint is the real API server and that anonymous/weak access is
      actually permitted, not merely reachable behind authn.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Restrict API access to trusted networks/VPN; disable anonymous auth;
        review audit logs.
      short_term_fix: >-
        Enforce strong authn (OIDC/mTLS) and RBAC least privilege; disable
        anonymous-auth.
      long_term_hardening: >-
        Private control plane, network policies, admission controls, and continuous
        posture scanning.
      code_fix_examples: {}
      config_examples:
        kubernetes: >-
          Set --anonymous-auth=false; enforce RBAC; restrict API server to private
          networks; enable audit logging.
    compensating_controls:
      - "Network allowlist / private endpoint"
      - "Admission control + audit logging"
    verification: >-
      Confirm an unauthenticated request to the API server is rejected (401/403)
      and the endpoint is not reachable from outside the allowed networks.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/306.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["cloud", "kubernetes", "control-plane"]

  - key: cloud.metadata_accessible
    kind: vulnerability
    aliases:
      - "Cloud Metadata Accessible"
    category: cloud
    cwe: CWE-918
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Critical when application requests can reach the cloud metadata endpoint
      (often via SSRF), since it can yield instance credentials. Lower if IMDSv2/
      hop-limit protections block credential retrieval.
    exploitability: >-
      High. Metadata access can yield temporary credentials for the instance role.
    business_impact: >-
      Retrieval of instance credentials leading to cloud resource access.
    why_it_matters: >-
      The metadata endpoint is a high-value SSRF target that can expose role
      credentials.
    detection_signal: >-
      The application can be made to reach the metadata IP/endpoint, or it is
      reachable from the app's request path.
    false_positive_check: >-
      Confirm the app's server (not the scanner) reached metadata and that
      credentials/data are actually retrievable.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Enforce IMDSv2 with a low hop limit; block outbound access to the metadata
        IP from application workloads; fix the SSRF path.
      short_term_fix: >-
        Require IMDSv2, minimize instance role permissions, and apply the SSRF-safe
        HTTP client to any URL-fetching feature.
      long_term_hardening: >-
        Egress controls, per-workload least-privilege roles, and network
        segmentation.
      code_fix_examples: {}
      config_examples:
        aws: >-
          Set metadata options to IMDSv2 required with http-put-response-hop-limit 1;
          scope the instance role to least privilege.
    compensating_controls:
      - "SSRF-safe HTTP client (see ssrf entries)"
      - "Egress filtering to the metadata IP"
    verification: >-
      Confirm the instance reports IMDSv2 required with hop limit 1, and that the
      application rejects requests aimed at the metadata address.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/918.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"
    tags: ["cloud", "metadata", "ssrf", "credentials"]

  # --- API / GraphQL (batch 1j — user-supplied) ------------------------------
  - key: api.bola_bfla
    kind: vulnerability
    aliases:
      - "Potential BOLA/BFLA"
    category: api
    cwe: CWE-639
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      Critical when an API allows access to other users' objects (BOLA) or
      functions (BFLA) beyond the caller's authorization. Lower to High/Medium if
      impact is read-only or limited.
    exploitability: >-
      High. Typically requires only altering an object id or calling a
      higher-privilege function.
    business_impact: >-
      Cross-tenant data disclosure/modification and privilege escalation via APIs.
    why_it_matters: >-
      Object- and function-level authorization is the most common API weakness and
      is frequently under-enforced.
    detection_signal: >-
      An API request returns or affects an object/function the authenticated
      caller is not authorized for.
    false_positive_check: >-
      Confirm with two consenting test accounts that account B can reach account
      A's object/function; a valid id returning only the caller's own data is not
      BOLA.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Add object- and function-level authorization checks at the API layer, or
        restrict the endpoint until enforced.
      short_term_fix: >-
        Verify ownership/role for every object and privileged function server-side;
        deny by default; scope queries to the caller/tenant.
      long_term_hardening: >-
        Centralized authorization policy, automated authz tests per endpoint, and
        an API inventory tracking auth per route.
      code_fix_examples:
        python: >-
          Enforce ownership in the query (WHERE owner_id = current_user) and a role
          check for privileged functions before executing.
        node: >-
          Apply an authorization middleware plus a per-object ownership check in the
          data layer; never trust the client-supplied id alone.
        java: >-
          Use method-level authorization and repository predicates binding the
          object to the authenticated principal.
      config_examples: {}
    compensating_controls:
      - "API gateway authorization policies"
      - "Per-tenant row-level security"
    verification: >-
      With two consenting test accounts, confirm account B receives 403/404 for
      account A's objects and privileged functions, and each still reaches its own.
    references:
      - "https://owasp.org/www-project-api-security/"
      - "https://cwe.mitre.org/data/definitions/639.html"
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
    tags: ["api", "authorization", "bola", "bfla"]

  - key: api.graphql_full_introspection
    kind: vulnerability
    aliases:
      - "GraphQL Full Introspection"
    category: api
    cwe: CWE-200
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High by default; treat as Critical only if introspection combines with
      missing authorization to expose sensitive operations/data. Lower if the
      schema is intentionally public and authorization is enforced per resolver.
    exploitability: >-
      Medium. Introspection reveals the full schema, easing discovery of sensitive
      operations.
    business_impact: >-
      Full schema disclosure aids targeting of under-protected queries/mutations.
    why_it_matters: >-
      Exposed introspection in production maps the entire API surface for review or
      abuse.
    detection_signal: >-
      The GraphQL endpoint returns a complete introspection result in production.
    false_positive_check: >-
      Confirm this is a production endpoint and introspection is enabled; a
      deliberately public schema with enforced authz is lower risk.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Disable introspection in production; require authentication on the GraphQL
        endpoint.
      short_term_fix: >-
        Enforce per-resolver authorization, query depth/complexity limits, and
        disable introspection for unauthenticated users.
      long_term_hardening: >-
        Schema governance, persisted queries, and continuous checks that
        introspection is off in prod.
      code_fix_examples:
        node: >-
          Disable introspection in the server config for production; add depth/
          complexity limits and per-resolver authz.
        python: >-
          Turn off introspection in the GraphQL app for production and enforce
          authorization in resolvers.
      config_examples: {}
    compensating_controls:
      - "Persisted/allowlisted queries"
      - "Query depth + complexity limits"
    verification: >-
      Confirm an introspection query against production is rejected, and that
      authenticated resolvers still enforce authorization.
    references:
      - "https://owasp.org/www-project-api-security/"
      - "https://cwe.mitre.org/data/definitions/200.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html"
    tags: ["api", "graphql", "introspection"]

  - key: api.graphql_introspection_enabled
    kind: vulnerability
    aliases:
      - "GraphQL Introspection Enabled"
    category: api
    cwe: CWE-200
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High when introspection is enabled in production; lower if the schema is
      intentionally public with authorization enforced per resolver.
    exploitability: >-
      Medium. Reveals schema details useful for discovery.
    business_impact: >-
      Schema disclosure that aids mapping of the API surface.
    why_it_matters: >-
      Production introspection generally should be disabled to reduce disclosure.
    detection_signal: >-
      Introspection queries succeed against a production GraphQL endpoint.
    false_positive_check: >-
      Confirm it is production and introspection is genuinely enabled rather than a
      staging/dev endpoint.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Disable introspection in production and require auth on the endpoint.
      short_term_fix: >-
        Per-resolver authorization and depth/complexity limits.
      long_term_hardening: >-
        Persisted queries and CI checks that introspection stays off in prod.
      code_fix_examples:
        node: >-
          Set introspection:false in production server options; add authz to
          resolvers.
      config_examples: {}
    compensating_controls:
      - "Persisted/allowlisted queries"
      - "Endpoint authentication"
    verification: >-
      Confirm introspection queries against production are rejected and the
      endpoint requires authentication.
    references:
      - "https://owasp.org/www-project-api-security/"
      - "https://cwe.mitre.org/data/definitions/200.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html"
    tags: ["api", "graphql", "introspection"]

  - key: api.mass_assignment
    kind: vulnerability
    aliases:
      - "Mass Assignment Risk"
    category: api
    cwe: CWE-915
    owasp: "A08:2021-Software and Data Integrity Failures"
    severity_guidance: >-
      Medium by default; High if binding untrusted fields can change privilege,
      ownership, price, or other sensitive attributes. Lower if inputs are strictly
      allowlisted.
    exploitability: >-
      Medium. Requires sending extra fields the endpoint binds without filtering.
    business_impact: >-
      Unauthorized modification of protected attributes (roles, flags, prices).
    why_it_matters: >-
      Binding request bodies directly to models can let clients set fields they
      should not control.
    detection_signal: >-
      The endpoint appears to bind request fields to model attributes without an
      explicit allowlist.
    false_positive_check: >-
      Confirm a protected attribute can actually be set via the request on a test
      account, not merely that the endpoint accepts JSON.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Allowlist bindable fields on the affected endpoint; reject or ignore
        unexpected attributes.
      short_term_fix: >-
        Use explicit DTOs/serializers with an allowlist; never bind request bodies
        straight to persistence models.
      long_term_hardening: >-
        Enforce input schemas across the API and add tests that protected fields
        cannot be set by clients.
      code_fix_examples:
        python: >-
          Use a serializer/schema listing only client-settable fields; set
          sensitive fields server-side.
        node: >-
          Pick allowed fields explicitly (e.g. a whitelist) before persisting;
          never spread the raw body into the model.
        java: >-
          Bind to a DTO with only permitted fields and map to the entity
          explicitly.
      config_examples: {}
    compensating_controls:
      - "Schema/DTO validation layer"
      - "Server-side setting of sensitive attributes"
    verification: >-
      On a test account, submit an update including a protected field and confirm
      it is ignored or rejected while permitted fields still update.
    references:
      - "https://owasp.org/www-project-api-security/"
      - "https://cwe.mitre.org/data/definitions/915.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html"
    tags: ["api", "mass-assignment", "input-validation"]

  - key: api.documentation_exposed
    kind: signal
    aliases:
      - "API Documentation Exposed"
    category: api
    cwe: CWE-200
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Info. Exposed API docs/schema are context, not a flaw in themselves. Raise
      only if the documented endpoints are found unauthenticated (handle under the
      relevant entry).
    exploitability: >-
      Low. Documentation aids discovery but grants no access.
    business_impact: >-
      Eases mapping of the API surface; valuable to confirm each endpoint is
      protected.
    why_it_matters: >-
      Public API docs in production reveal the surface that must be authenticated
      and rate-limited.
    detection_signal: >-
      An API documentation/schema page (e.g. swagger/openapi) is reachable without
      authentication.
    false_positive_check: >-
      Confirm it is production and unauthenticated; docs on an internal/staging
      host are lower concern.
    triage_priority: P4
    remediation:
      immediate_mitigation: >-
        Require authentication for docs in production, or restrict to internal
        networks.
      short_term_fix: >-
        Ensure every documented endpoint enforces authn/authz and rate limiting.
      long_term_hardening: >-
        Govern where docs are published and keep an API inventory with auth status.
      code_fix_examples: {}
      config_examples: {}
    compensating_controls:
      - "Auth-gated or internal-only documentation"
      - "API inventory with per-route auth status"
    verification: >-
      Confirm the documentation page requires authentication (or is unreachable
      externally) and that documented endpoints reject unauthenticated calls.
    references:
      - "https://owasp.org/www-project-api-security/"
      - "https://cwe.mitre.org/data/definitions/200.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["api", "documentation", "signal"]

  # --- XML / prototype pollution / cache / smuggling (user-supplied) --------
  # ---------- xml ----------

  - key: xml.xxe_file_read
    kind: vulnerability
    aliases:
      - "XXE (File Read)"
    category: xml
    cwe: CWE-611
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Critical when external entity processing lets the server read local files or
      reach internal resources. Lower to High if impact is limited (error-based
      only) or Medium if entities are partially restricted.
    exploitability: >-
      High. Submitting XML with entity definitions to a parser that resolves them.
    business_impact: >-
      Disclosure of local files, internal service access (SSRF-like), and possible
      denial of service.
    why_it_matters: >-
      XML parsers that resolve external entities can be abused to read files or
      reach internal endpoints.
    detection_signal: >-
      An XML-processing endpoint reflects or acts on external-entity content in a
      controlled, benign probe (e.g. a marker resolves).
    false_positive_check: >-
      Confirm the parser actually resolved the benign external entity marker rather
      than echoing input verbatim.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Disable external entity and DTD processing on the affected parser now, or
        block XML input at the edge until fixed.
      short_term_fix: >-
        Configure the XML parser to disable DOCTYPE/DTD and external entities;
        prefer a hardened parser configuration.
      long_term_hardening: >-
        Standardize a secure XML parsing helper across the codebase and add tests
        that DTDs are rejected.
      code_fix_examples:
        python: >-
          Use defusedxml (or disable resolve_entities); do not use raw parsers with
          entity resolution enabled.
        java: >-
          Set factory features to disallow DOCTYPE (disallow-doctype-decl true) and
          disable external general/parameter entities.
        node: >-
          Use a parser configured without external entity/DTD support; reject
          DOCTYPE.
        php: >-
          Avoid enabling external entity loading; use a parser configuration that
          disables DTDs.
      config_examples: {}
    verification: >-
      Submit a benign XML document with a DOCTYPE/entity marker and confirm the
      parser rejects or ignores it without resolving the entity.
    compensating_controls:
      - "Edge filtering of XML with DOCTYPE declarations"
      - "SSRF egress controls for parser hosts"
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/611.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html"
    tags: ["xml", "xxe", "parser"]

  - key: xml.xpath_injection
    kind: vulnerability
    aliases:
      - "XML/XPath Injection"
    category: xml
    cwe: CWE-643
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      High when untrusted input alters an XPath/XML query affecting authorization
      or data selection. Lower if the query result is non-sensitive and access is
      otherwise controlled.
    exploitability: >-
      Medium. Requires an input that is concatenated into an XPath/XML query.
    business_impact: >-
      Unauthorized data selection or authentication bypass in XML-backed logic.
    why_it_matters: >-
      Building XPath queries from raw input allows query structure to be altered.
    detection_signal: >-
      Input influences XML/XPath query behavior in a way that changes results for a
      benign, controlled probe.
    false_positive_check: >-
      Confirm the input changes query semantics rather than merely being echoed or
      validated away.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Validate/reject unexpected characters in the affected input, or restrict the
        endpoint until parameterized.
      short_term_fix: >-
        Use parameterized XPath/precompiled expressions with variable binding; never
        concatenate input into queries.
      long_term_hardening: >-
        Centralize XML query handling with safe binding and input validation.
      code_fix_examples:
        java: >-
          Use XPath variable resolver / setXPathVariableResolver rather than string
          concatenation.
        python: >-
          Bind values via the XPath library's variables interface instead of format
          strings.
      config_examples: {}
    verification: >-
      Re-run the benign probe after the fix and confirm the query result no longer
      changes with altered input.
    compensating_controls:
      - "Strict input validation on XML-query parameters"
    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/643.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["xml", "xpath", "injection"]

  - key: xml.endpoint_detected
    kind: signal
    aliases:
      - "XML Endpoint Detected"
    category: xml
    cwe: CWE-611
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Info. An XML-accepting endpoint is context for XXE/injection review, not a
      flaw itself. Raise only if unsafe parsing is confirmed (handle under the XXE/
      injection entry).
    exploitability: >-
      Low. Discovery only.
    business_impact: >-
      Identifies where to verify XML parser hardening.
    why_it_matters: >-
      Knowing XML endpoints lets the team confirm entity/DTD processing is disabled.
    detection_signal: >-
      An endpoint accepts or returns XML content.
    false_positive_check: >-
      Confirm the endpoint genuinely processes XML rather than treating it as opaque
      text.
    triage_priority: P4
    remediation:
      immediate_mitigation: >-
        Verify the endpoint's XML parser disables DTDs/external entities.
      short_term_fix: >-
        Apply the secure XML parsing configuration to this endpoint.
      long_term_hardening: >-
        Track XML endpoints in the API inventory with parser-hardening status.
      code_fix_examples: {}
      config_examples: {}
    verification: >-
      Confirm a benign DOCTYPE probe is rejected by the endpoint's parser.
    compensating_controls:
      - "Secure XML parsing helper applied everywhere"
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/611.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["xml", "discovery", "signal"]

  # ---------- proto_pollution ----------

  - key: proto_pollution.server_side
    kind: vulnerability
    aliases:
      - "Potential Server-Side Prototype Pollution"
    category: proto_pollution
    cwe: CWE-1321
    owasp: "A08:2021-Software and Data Integrity Failures"
    severity_guidance: >-
      High when polluting object prototypes can alter server behavior (auth flags,
      logic, or lead to further impact). Lower to Medium if impact is limited to
      non-sensitive properties.
    exploitability: >-
      Medium. Requires an input path that merges untrusted keys into objects.
    business_impact: >-
      Logic tampering, privilege/flag manipulation, or a stepping stone to RCE in
      some stacks.
    why_it_matters: >-
      Unsafe recursive merges of untrusted input can modify shared object
      prototypes.
    detection_signal: >-
      A benign, uniquely named property injected via special keys appears reflected
      in unrelated object behavior.
    false_positive_check: >-
      Confirm the injected marker property actually affects object behavior rather
      than being stored as ordinary data.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Reject special keys (__proto__, constructor, prototype) in inbound data, or
        restrict the endpoint until fixed.
      short_term_fix: >-
        Use safe merge/clone utilities, null-prototype objects (Object.create(null))
        or Map, and validate input keys against an allowlist.
      long_term_hardening: >-
        Replace recursive merges with schema-validated deserialization and add tests
        that special keys are rejected.
      code_fix_examples:
        node: >-
          Guard against __proto__/constructor/prototype keys before merging; prefer
          Map or Object.create(null) for untrusted key/value data.
      config_examples: {}
    verification: >-
      Re-send the benign marker via special keys after the fix and confirm object
      behavior is unaffected.
    compensating_controls:
      - "Schema validation rejecting unexpected keys"
    references:
      - "https://cwe.mitre.org/data/definitions/1321.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["prototype-pollution", "nodejs", "integrity"]

  - key: proto_pollution.client_side
    kind: vulnerability
    aliases:
      - "Client-Side Prototype Pollution"
    category: proto_pollution
    cwe: CWE-1321
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      Medium by default; High if it leads to DOM XSS or auth-relevant behavior in
      the browser. Lower if no sensitive sink is reachable.
    exploitability: >-
      Medium. Requires a client-side merge of attacker-influenced data.
    business_impact: >-
      Client-side logic tampering, potentially escalating to DOM-based XSS.
    why_it_matters: >-
      Polluted prototypes in the browser can change script behavior or feed XSS
      sinks.
    detection_signal: >-
      A benign marker injected via special keys influences client-side object
      behavior.
    false_positive_check: >-
      Confirm the marker changes behavior via a prototype, not just normal data
      handling.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Sanitize client-side inputs used in object merges; avoid merging untrusted
        URL/JSON data into shared objects.
      short_term_fix: >-
        Use safe libraries/patterns, null-prototype objects, and block special keys
        on the client.
      long_term_hardening: >-
        Add CSP and Trusted Types to reduce downstream XSS impact and review
        client-side data flows.
      code_fix_examples:
        node: >-
          On the client, reject __proto__/constructor/prototype keys and prefer Map
          for untrusted key/value data.
      config_examples: {}
    verification: >-
      Confirm the benign marker no longer changes client object behavior after the
      fix.
    compensating_controls:
      - "CSP + Trusted Types to limit XSS impact"
    references:
      - "https://cwe.mitre.org/data/definitions/1321.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["prototype-pollution", "client-side", "dom"]

  - key: proto_pollution.sink
    kind: vulnerability
    aliases:
      - "Prototype Pollution Sink"
    category: proto_pollution
    cwe: CWE-1321
    owasp: "A03:2021-Injection"
    severity_guidance: >-
      Medium by default; this is a code-review item flagging a risky sink. Escalate
      to a server- or client-side prototype-pollution entry only if a controllable
      source reaches the sink.
    exploitability: >-
      Low. A sink alone is not exploitable without a reaching source.
    business_impact: >-
      Indicates code where prototype pollution could occur if fed untrusted input.
    why_it_matters: >-
      Risky merge/assignment patterns are worth fixing before a source connects to
      them.
    detection_signal: >-
      Code or behavior indicating a recursive-merge/assignment sink that could be
      polluted.
    false_positive_check: >-
      Confirm a user-controllable source can actually reach the sink; otherwise it
      is a hardening note, not a live finding.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Review the sink; add special-key guards where untrusted data could reach it.
      short_term_fix: >-
        Replace unsafe merges with safe utilities and key allowlists.
      long_term_hardening: >-
        Lint rules flagging risky merge patterns; schema validation on inputs.
      code_fix_examples: {}
      config_examples: {}
    verification: >-
      Confirm the sink rejects special keys or is unreachable from untrusted input.
    compensating_controls:
      - "Static analysis / lint rules for unsafe merges"
    references:
      - "https://cwe.mitre.org/data/definitions/1321.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["prototype-pollution", "sink", "code-review"]

  # ---------- cache ----------

  - key: cache.web_cache_poisoning
    kind: vulnerability
    aliases:
      - "Web Cache Poisoning"
    category: cache
    cwe: CWE-444
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High when an unkeyed input can cause a harmful response to be cached and
      served to other users. Lower if the cache key covers the input or the
      affected response is non-sensitive.
    exploitability: >-
      Medium. Requires an unkeyed input that influences a cacheable response.
    business_impact: >-
      Serving malicious or incorrect content to many users from the cache.
    why_it_matters: >-
      Caches keyed on incomplete inputs can store and replay attacker-influenced
      responses.
    detection_signal: >-
      An unkeyed header/parameter changes a cacheable response and the change
      persists for a benign marker.
    false_positive_check: >-
      Confirm the response is actually cached and served to other requests, not just
      reflected once.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Include the influencing input in the cache key or mark the response
        no-store until fixed.
      short_term_fix: >-
        Normalize and key on all inputs that affect the response; avoid reflecting
        unkeyed headers into cacheable output.
      long_term_hardening: >-
        Review cache configuration end-to-end (CDN + app) and add tests for cache
        key correctness.
      code_fix_examples: {}
      config_examples:
        cdn: >-
          Add the influencing header/parameter to the cache key (Vary or cache-key
          config), or set Cache-Control no-store for affected responses.
    verification: >-
      Confirm the benign marker no longer persists in cached responses served to
      other requests after the fix.
    compensating_controls:
      - "Vary headers on inputs that affect responses"
      - "no-store on dynamic/sensitive responses"
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/444.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["cache", "poisoning", "cdn"]

  - key: cache.web_cache_deception
    kind: vulnerability
    aliases:
      - "Web Cache Deception"
    category: cache
    cwe: CWE-525
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High when a caching rule can be tricked into caching an authenticated,
      sensitive response at a public path. Lower if no sensitive content is
      cacheable.
    exploitability: >-
      Medium. Depends on path/extension-based caching rules interacting with
      authenticated responses.
    business_impact: >-
      Sensitive user responses cached and retrievable by others.
    why_it_matters: >-
      Extension/path-based cache rules can cache dynamic authenticated content
      unintentionally.
    detection_signal: >-
      A crafted-but-benign path variant causes an authenticated response to be
      cached publicly.
    false_positive_check: >-
      Confirm the sensitive response is actually cached and retrievable without the
      original session.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Set Cache-Control no-store on authenticated/dynamic responses; tighten cache
        rules to not cache by extension alone.
      short_term_fix: >-
        Cache only known-static content by explicit rules; never cache authenticated
        responses.
      long_term_hardening: >-
        Review CDN/app cache rules and add tests that authenticated paths are not
        cached.
      code_fix_examples: {}
      config_examples:
        cdn: >-
          Restrict caching to explicit static paths/types; set no-store for
          authenticated responses.
    verification: >-
      Confirm the authenticated response is not served from cache to a different
      session after the fix.
    compensating_controls:
      - "no-store on authenticated responses"
      - "Explicit static-only cache rules"
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/525.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["cache", "deception", "cdn"]

  - key: cache.host_header_injection
    kind: vulnerability
    aliases:
      - "Host Header Injection"
    category: cache
    cwe: CWE-644
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High when the app uses an attacker-controlled Host header to build links,
      password-reset URLs, or cache keys. Lower if Host is validated and never
      reflected into sensitive output.
    exploitability: >-
      Medium. Requires the app to trust the Host header for a sensitive purpose.
    business_impact: >-
      Poisoned links/reset emails, cache issues, or routing to attacker-controlled
      hosts.
    why_it_matters: >-
      Trusting the Host header lets a client influence generated URLs and cache
      behavior.
    detection_signal: >-
      A benign, distinct Host value is reflected into responses, links, or cache
      behavior.
    false_positive_check: >-
      Confirm the app actually uses the supplied Host for a sensitive purpose rather
      than ignoring it.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Validate the Host header against an allowlist at the edge/app; reject
        unknown hosts.
      short_term_fix: >-
        Use a configured canonical host for generated URLs; do not build links/reset
        URLs from the request Host.
      long_term_hardening: >-
        Enforce host allowlisting and canonical URL configuration across services.
      code_fix_examples:
        python: >-
          Configure ALLOWED_HOSTS and a canonical site URL; build absolute URLs from
          config, not request.Host.
        node: >-
          Validate req.headers.host against an allowlist; use a configured base URL
          for links.
      config_examples:
        nginx: >-
          Use a strict server_name match and return 421/444 for unknown Host values.
    verification: >-
      Confirm a distinct benign Host value is rejected or not reflected into links/
      cache after the fix.
    compensating_controls:
      - "Edge host allowlisting"
      - "Canonical base-URL configuration"
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/644.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["cache", "host-header", "misconfiguration"]

  # ---------- smuggling ----------

  - key: smuggling.cl_te
    kind: vulnerability
    aliases:
      - "Potential CL.TE Smuggling"
    category: smuggling
    cwe: CWE-444
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Critical when front-end and back-end disagree on request boundaries, allowing
      request smuggling. Lower to High if only a timing signal is observed without
      confirmed desync.
    exploitability: >-
      Medium. Depends on a proxy/back-end parsing discrepancy.
    business_impact: >-
      Request queue poisoning, cache poisoning, and bypass of front-end controls
      affecting other users.
    why_it_matters: >-
      Inconsistent handling of Content-Length vs Transfer-Encoding between hops lets
      requests desynchronize.
    detection_signal: >-
      A benign, safe probe indicates the front-end and back-end interpret request
      length/encoding differently (e.g. a timing differential).
    false_positive_check: >-
      Confirm the differential is a genuine parsing discrepancy, ruling out network
      jitter and normal timeouts across repeated safe probes.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Normalize/reject ambiguous requests at the front-end (reject conflicting
        Content-Length and Transfer-Encoding); prefer HTTP/2 to the back-end.
      short_term_fix: >-
        Ensure front-end and back-end use the same, strict HTTP parsing; disable
        connection reuse where mismatch exists.
      long_term_hardening: >-
        Standardize the proxy/back-end stack, keep it patched, and add monitoring for
        desync indicators.
      code_fix_examples: {}
      config_examples:
        proxy: >-
          Reject messages with both Content-Length and Transfer-Encoding; enforce
          strict parsing and prefer HTTP/2 upstream.
    verification: >-
      Re-run the safe probe after the fix and confirm the front-end and back-end
      agree on request boundaries.
    compensating_controls:
      - "Strict, uniform HTTP parsing across hops"
      - "Monitoring/alerting on desync indicators"
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/444.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["request-smuggling", "http", "proxy"]

  - key: smuggling.te_cl
    kind: vulnerability
    aliases:
      - "Potential TE.CL Smuggling"
    category: smuggling
    cwe: CWE-444
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Critical when a Transfer-Encoding/Content-Length discrepancy allows request
      smuggling. Lower to High if only an inconclusive timing signal is seen.
    exploitability: >-
      Medium. Depends on a proxy/back-end parsing discrepancy.
    business_impact: >-
      Request queue/cache poisoning and control bypass affecting other users.
    why_it_matters: >-
      Differing precedence of Transfer-Encoding vs Content-Length between hops lets
      requests desynchronize.
    detection_signal: >-
      A benign, safe probe indicates differing length/encoding interpretation
      between front-end and back-end.
    false_positive_check: >-
      Confirm a genuine parsing discrepancy across repeated safe probes, ruling out
      jitter and timeouts.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Reject ambiguous requests at the front-end and normalize encoding; prefer
        HTTP/2 upstream.
      short_term_fix: >-
        Enforce identical strict HTTP parsing across hops; disable risky connection
        reuse.
      long_term_hardening: >-
        Consolidate and patch the proxy/back-end stack; monitor for desync signals.
      code_fix_examples: {}
      config_examples:
        proxy: >-
          Reject conflicting Content-Length/Transfer-Encoding; enforce strict parsing
          and prefer HTTP/2 upstream.
    verification: >-
      Re-run the safe probe after the fix and confirm consistent request-boundary
      handling across hops.
    compensating_controls:
      - "Uniform strict HTTP parsing"
      - "Desync monitoring/alerting"
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/444.html"
