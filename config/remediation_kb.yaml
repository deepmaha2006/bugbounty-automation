  # ---------- business_logic ----------

  - key: business_logic.price_manipulation
    kind: vulnerability
    aliases:
      - "Potential Price Manipulation"
    category: business_logic
    cwe: CWE-840
    owasp: "A04:2021-Insecure Design"
    severity_guidance: >-
      Medium by default; High if a client can set or alter price/total and the
      server accepts it. Lower if server-side pricing is authoritative.
    exploitability: >-
      Medium. Requires the server to trust client-supplied pricing fields.
    business_impact: >-
      Financial loss from manipulated prices, totals, or currency.
    why_it_matters: >-
      Trusting client-provided monetary values lets buyers change what they pay.
    detection_signal: >-
      Price/total/amount fields are accepted from the client and appear to affect
      the charged amount.
    false_positive_check: >-
      Confirm on a test order that a changed client price actually changes the
      server-computed total, not just a display value.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Recompute all prices/totals server-side from trusted catalog data; ignore
        client-supplied amounts.
      short_term_fix: >-
        Treat pricing as server-authoritative; validate quantities and currency
        server-side.
      long_term_hardening: >-
        Centralized pricing service and tests that client price fields cannot alter
        totals.
      code_fix_examples:
        python: >-
          Look up unit price from the catalog and compute totals server-side; never
          trust a price field from the request.
      config_examples: {}
    verification: >-
      Confirm a modified client price on a test order does not change the charged
      total.
    compensating_controls:
      - "Server-authoritative pricing"
      - "Order review/anomaly checks"
    references:
      - "https://owasp.org/Top10/A04_2021-Insecure_Design/"
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["business-logic", "pricing", "integrity"]

