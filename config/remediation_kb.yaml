      confirmed.
    exploitability: >-
      Medium when a critical operation lacks concurrency control.
    business_impact: >-
      Double-spend, duplicate actions, or limit bypass under concurrency.
    why_it_matters: >-
      Operations without atomicity/locking can be abused with concurrent requests.
    detection_signal: >-
      A critical operation appears to lack locking/atomicity around a shared
      resource.
    false_positive_check: >-
      Confirm with a controlled test that concurrent benign requests actually
      produce an inconsistent result.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Add idempotency keys or a lock around the critical operation.
      short_term_fix: >-
        Use atomic DB operations/transactions or row locks; enforce idempotency.
      long_term_hardening: >-
        Design critical flows for concurrency and add tests exercising parallel
        requests.
      code_fix_examples: {}
      config_examples: {}
    verification: >-
      Confirm concurrent benign requests produce a single consistent result after
      the fix.
    compensating_controls:
      - "Idempotency keys"
      - "Database-level constraints/locks"
    references:
      - "https://cwe.mitre.org/data/definitions/362.html"
      - "https://owasp.org/Top10/A04_2021-Insecure_Design/"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["business-logic", "race-condition", "concurrency"]

