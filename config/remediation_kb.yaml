  - key: auth_session.jwt_none_algorithm
    kind: vulnerability
    aliases:
      - JWT None Algorithm
    category: auth_session
    cwe: CWE-347
    owasp: "A02:2021-Cryptographic Failures"
    severity_guidance: >-
      Critical — the server accepts tokens without a verified signature, so
      token contents cannot be trusted at all.
    exploitability: >-
      High — no key material is needed once unsigned tokens are accepted.
    business_impact: >-
      Authentication and authorization bypass: identities and roles in tokens
      can be forged.
    why_it_matters: >-
      The token verification logic accepts tokens that declare no signing
      algorithm, which means signatures are not actually enforced.
    detection_signal: >-
      The server accepted a token whose header declares no signature
      algorithm.
    false_positive_check: >-
      Confirm the unsigned token was accepted by an endpoint that requires
      authentication and produced an authenticated response, using a test
      account's own claims.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Deploy a fix that rejects unsigned tokens, then revoke active tokens
        (rotate the signing key) so any forged tokens become invalid.
      short_term_fix: >-
        Pass an explicit allow-list of accepted algorithms to the verification
        call and reject anything else, including "none".
      long_term_hardening: >-
        Centralize token verification in one audited helper, keep the JWT
        library current, and add tests that assert unsigned and wrong-algorithm
        tokens are rejected.
      code_fix_examples:
        python: >-
          PyJWT: jwt.decode(token, key, algorithms=["RS256"]) — always pass
          the algorithms list explicitly.
        node: >-
          jsonwebtoken: jwt.verify(token, key, { algorithms: ['RS256'] }).
        java: >-
          Build the verifier with a fixed algorithm (e.g. JJWT
          Jwts.parser().verifyWith(publicKey)), never inferring it from the
          token header.
        php: >-
          firebase/php-jwt: JWT::decode($token, new Key($key, 'RS256')) with
          a fixed algorithm.
      config_examples: {}
    compensating_controls:
      - Short token lifetime with server-side revocation
    verification: >-
      Confirm an unsigned test token is rejected with 401 and a correctly
      signed token is still accepted.
    references:
      - https://cwe.mitre.org/data/definitions/347.html
      - https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/10-Testing_JSON_Web_Tokens
    tags: [jwt, crypto, authentication, owasp-a02]

  - key: auth_session.jwt_weak_secret
    kind: vulnerability
    aliases:
      - JWT Weak Secret Key
    category: auth_session
    cwe: CWE-326
    owasp: "A02:2021-Cryptographic Failures"
    severity_guidance: >-
      Critical — a guessable HMAC secret lets anyone mint valid tokens (the
      resulting signature bypass is also CWE-347).
    exploitability: >-
      High — weak shared secrets are recovered offline from a single issued
      token using widely available tooling.
    business_impact: >-
      Token forgery: arbitrary identities and roles, full authentication and
      authorization bypass.
    why_it_matters: >-
      The HMAC key used to sign tokens is short or common, so an attacker who
      obtains any token can derive the key and sign their own.
    detection_signal: >-
      A token issued by the application was verified against a list of
      common/weak secrets and one matched.
    false_positive_check: >-
      Confirm the matched secret verifies a real token issued by the
      production application (not a test fixture or a different environment).
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Rotate the signing secret to a strong random value immediately, which
        invalidates all existing tokens, and review logs for tokens issued
        with unexpected claims.
      short_term_fix: >-
        Use a secret of at least 256 bits from a CSPRNG stored in a secrets
        manager, or switch to asymmetric signing (RS256/ES256) so services only
        need the public key.
      long_term_hardening: >-
        Rotate signing keys on a schedule with key identifiers, keep secrets
        out of source control, and scan repositories for leaked secrets.
      code_fix_examples:
        python: Generate with secrets.token_bytes(32) and load from a secrets manager; or sign with an RSA/EC private key.
        node: Generate with crypto.randomBytes(32); prefer RS256/ES256 key pairs.
        java: Use a 256-bit+ key from a KeyStore or secrets manager, or an asymmetric key pair.
        php: Generate with random_bytes(32) and load from the environment/secrets manager.
      config_examples: {}
    compensating_controls:
      - Short token lifetimes with refresh-token rotation
      - Anomaly alerts on privileged claims
    verification: >-
      Confirm newly issued tokens no longer verify against any weak-secret
      list and the secret is stored in the secrets manager, not in code.
    references:
      - https://cwe.mitre.org/data/definitions/326.html
      - https://cwe.mitre.org/data/definitions/347.html
      - https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/10-Testing_JSON_Web_Tokens
    tags: [jwt, crypto, secrets, owasp-a02]

  - key: auth_session.jwt_kid_injection
    kind: vulnerability
    aliases:
      - JWT KID Injection
    category: auth_session
    cwe: CWE-347
    owasp: "A02:2021-Cryptographic Failures"
    severity_guidance: >-
      High by default. Raise to Critical if the key-selection behaviour lets a
      token be verified with attacker-influenced key material.
    exploitability: >-
      Medium — depends on how the server resolves the key identifier (file
      paths, database lookups, or URLs).
    business_impact: >-
      Possible token forgery and authentication bypass, plus secondary issues
      where the key lookup touches files or a database.
    why_it_matters: >-
      The server uses the token's own "kid" header to decide which key to
      verify with, without restricting it to a fixed set of known keys.
    detection_signal: >-
      Varying the token's key-identifier header with benign values changed how
      the server processed the token.
    false_positive_check: >-
      Confirm the behaviour difference comes from key resolution (e.g. a
      distinct error per kid value) rather than generic token parsing errors.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Reject tokens whose kid is not in the configured key set at the
        gateway, and rotate keys if forgery cannot be ruled out.
      short_term_fix: >-
        Map kid to keys only through a fixed, server-side dictionary (or a
        trusted JWKS fetched from a configured URL); never use kid in file
        paths, queries, or as a URL.
      long_term_hardening: >-
        Centralize verification, pin algorithms per key, and add tests for
        unknown and malformed kid values.
      code_fix_examples:
        python: >-
          keys = {"2026-01": pubkey}; key = keys.get(header["kid"]) — reject if
          missing, then jwt.decode(token, key, algorithms=["RS256"]).
        node: Use jwks-rsa with a configured JWKS URI (or a static key map) and reject unknown kid values.
        java: Resolve kid through a static key map or a trusted JWKS source; reject unknown identifiers.
        php: Use a fixed kid => Key map with firebase/php-jwt and reject unknown identifiers.
      config_examples: {}
    compensating_controls:
      - Gateway-level validation of kid against the known key set
    verification: >-
      Confirm tokens with unknown or malformed kid values are rejected with a
      uniform 401 and valid tokens still verify.
    references:
      - https://cwe.mitre.org/data/definitions/347.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/10-Testing_JSON_Web_Tokens
      - https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
    tags: [jwt, crypto, key-management, owasp-a02]

  # --- Security misconfiguration: exposed files, debug ----------------------
  - key: sec_misconfig.git_exposure
    kind: vulnerability
    aliases:
      - .git Repository Exposure
    category: sec_misconfig
    cwe: CWE-527
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High by default. Raise to Critical when the repository history contains
      credentials, keys, or configuration secrets (then also run the "rotate
      exposed secrets" action); lower to Medium if only a public open-source
      codebase is exposed.
    exploitability: >-
      High — repository contents can be reconstructed with widely available
      tooling once the metadata directory is reachable.
    business_impact: >-
      Source code disclosure, including history, which frequently contains
      hard-coded secrets and reveals other vulnerabilities.
    why_it_matters: >-
      The version-control metadata directory was deployed into the web root,
      so the application's source and history can be downloaded.
    detection_signal: >-
      A request for the repository's HEAD reference under /.git/ returned 200
      with valid git content.
    false_positive_check: >-
      Confirm the response body is genuine git metadata (not a soft-404 page
      or a catch-all SPA route returning 200 for every path).
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Block /.git (and all dot-paths) at the edge now; treat every secret
        found in the repository history as compromised and rotate it.
      short_term_fix: >-
        Remove the .git directory from the deployed web root and change the
        deployment to ship build artifacts only.
      long_term_hardening: >-
        Deny dotfiles by default in server config, use artifact-based deploys,
        and scan repositories for secrets in CI.
      code_fix_examples: {}
      config_examples:
        nginx: location ~ /\.(?!well-known) { deny all; }
        apache: >-
          RedirectMatch 404 /\.git or <DirectoryMatch "/\.git"> Require all
          denied </DirectoryMatch>
    compensating_controls:
      - Edge rule denying dot-paths
      - Secret scanning with automatic rotation playbooks
    verification: >-
      Request the /.git/HEAD path and confirm 403/404; confirm the deployed
      web root contains no .git directory and exposed secrets were rotated.
    references:
      - https://cwe.mitre.org/data/definitions/527.html
      - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information
    tags: [exposure, source-code, secrets, owasp-a05]

  - key: sec_misconfig.env_file_exposure
    kind: vulnerability
    aliases:
      - Environment File Exposure
    category: sec_misconfig
    cwe: CWE-538
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Critical when the file contains credentials, API keys, or signing
      secrets (the usual case); High if it contains only non-secret settings.
    exploitability: >-
      High — the file is retrievable with a single unauthenticated request.
    business_impact: >-
      Direct exposure of database credentials, cloud keys, and signing
      secrets, enabling data access and infrastructure compromise.
    why_it_matters: >-
      The environment configuration file sits in a web-accessible directory,
      so its secrets are downloadable.
    detection_signal: >-
      A request for an environment file (e.g. .env) returned 200 with
      key=value configuration content.
    false_positive_check: >-
      Confirm the body is a real configuration file (key=value pairs) rather
      than a soft-404 or SPA fallback page.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Block the path at the edge now and rotate every credential and key in
        the file; review access logs to see whether it was downloaded.
      short_term_fix: >-
        Move environment files outside the web root and load configuration
        from environment variables or a secrets manager.
      long_term_hardening: >-
        Deny dotfiles by default, keep secrets only in a secrets manager, and
        add deployment checks that fail if config files are in the web root.
      code_fix_examples:
        python: Read settings from environment variables / a secrets manager; keep .env out of the served directory.
        node: Load config at process start from the environment; never serve the project root statically.
        php: Keep .env above the public/ directory (Laravel's default layout).
      config_examples:
        nginx: location ~ /\.(?!well-known) { deny all; }
        apache: <FilesMatch "^\."> Require all denied </FilesMatch>
    compensating_controls:
      - Secrets manager with short-lived credentials
      - Access-log alerting on requests for dotfiles
    verification: >-
      Request the file path and confirm 403/404; confirm the rotated
      credentials are in use and the old ones are revoked.
    references:
      - https://cwe.mitre.org/data/definitions/538.html
      - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    tags: [exposure, secrets, configuration, owasp-a05]

  - key: sec_misconfig.phpinfo_exposure
    kind: vulnerability
    aliases:
      - PHPInfo Exposure
    category: sec_misconfig
    cwe: CWE-200
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High by default when environment variables or secrets appear in the
      output; Medium when it shows only versions and paths.
    exploitability: >-
      Medium — no exploitation needed to read it; value depends on what the
      page reveals.
    business_impact: >-
      Discloses versions, paths, loaded modules, and sometimes environment
      secrets, easing further attacks.
    why_it_matters: >-
      A diagnostic page that prints the full PHP configuration is publicly
      reachable.
    detection_signal: >-
      A publicly reachable page returned PHP configuration diagnostic output.
    false_positive_check: >-
      Confirm the page is served by the production host and shows live
      configuration output (not documentation text).
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Delete or block the diagnostic page; rotate any secrets it displayed.
      short_term_fix: Remove diagnostic scripts from deployed code.
      long_term_hardening: >-
        Exclude diagnostic files from builds and add a deploy check that
        fails when they are present.
      code_fix_examples: {}
      config_examples:
        php: Set expose_php = Off and keep display_errors = Off in production.
    compensating_controls:
      - Edge rule blocking known diagnostic paths
    verification: Request the page and confirm 404/403.
    references:
      - https://cwe.mitre.org/data/definitions/200.html
      - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/02-Test_Application_Platform_Configuration
    tags: [exposure, diagnostics, owasp-a05]

  - key: sec_misconfig.debug_mode_enabled
    kind: vulnerability
    aliases:
      - Debug Mode Enabled
    category: sec_misconfig
    cwe: CWE-489
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High by default. Raise to Critical when the debug interface allows
      interactive code evaluation or displays secrets; lower to Medium when
      only stack traces are shown.
    exploitability: >-
      Medium to High — depends on the framework's debug features; stack
      traces alone aid reconnaissance, interactive consoles are far worse.
    business_impact: >-
      Disclosure of source, configuration, and secrets; in some frameworks,
      remote code execution through the debug console.
    why_it_matters: >-
      The application runs with development debugging enabled in a
      publicly reachable environment.
    detection_signal: >-
      Error responses contain framework debug pages, stack traces, or
      configuration dumps.
    false_positive_check: >-
      Confirm the debug output comes from the production deployment (not a
      custom error page that merely looks similar).
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Turn debug off in production configuration and redeploy; rotate
        secrets that were shown in debug output.
      short_term_fix: >-
        Configure generic error pages and send detailed errors to server-side
        logs only.
      long_term_hardening: >-
        Separate environment configs, make "debug off" the production default
        enforced by a startup check, and centralize error logging.
      code_fix_examples:
        python: Django DEBUG = False with ALLOWED_HOSTS set; Flask app.debug = False (never run the dev server in production).
        node: Set NODE_ENV=production and use an error handler that returns a generic message.
        java: Spring Boot server.error.include-stacktrace=never and disable devtools in production.
        php: display_errors = Off, log_errors = On; framework APP_DEBUG=false.
      config_examples: {}
    compensating_controls:
      - Edge rule replacing 5xx bodies with a generic error page
    verification: >-
      Trigger a harmless not-found or validation error and confirm a generic
      error page without stack traces is returned.
    references:
      - https://cwe.mitre.org/data/definitions/489.html
      - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
      - https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
    tags: [debug, error-handling, owasp-a05]

  # --- Security misconfiguration: CORS, cookies, methods, disclosure --------
  - key: sec_misconfig.cors_misconfiguration
    kind: vulnerability
    aliases:
      - CORS Misconfiguration
    category: sec_misconfig
    cwe: CWE-942
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High by default. Raise to Critical when an arbitrary or reflected Origin
      is allowed together with credentials on endpoints returning personal or
      account data; lower to Low for a non-credentialed, read-only public API.
    exploitability: >-
      Medium — a victim must visit a malicious site while logged in, but no
      other preconditions apply when credentials are allowed.
    business_impact: >-
      Other websites can read authenticated responses on a user's behalf,
      exposing account data and tokens.
    why_it_matters: >-
      The server's cross-origin policy trusts origins it should not, letting
      untrusted sites make credentialed requests and read the answers.
    detection_signal: >-
      Access-Control-Allow-Origin reflects an arbitrary Origin (or allows
      null) while Access-Control-Allow-Credentials is true.
    false_positive_check: >-
      Confirm the reflected origin appears together with
      Access-Control-Allow-Credentials: true on an endpoint that returns
      user-specific data; reflection without credentials, or on public data,
      is lower impact.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Remove Access-Control-Allow-Credentials or restrict the allowed origin
        at the edge for the affected endpoints.
      short_term_fix: >-
        Replace origin reflection with an explicit allow-list of exact
        origins; never reflect Origin or allow null when credentials are
        permitted; add Vary: Origin.
      long_term_hardening: >-
        Define CORS policy centrally, review it per API, and add tests for
        disallowed origins.
      code_fix_examples:
        python: >-
          fastapi.middleware.cors.CORSMiddleware(allow_origins=["https://app.example.com"],
          allow_credentials=True) — explicit list, no regex that matches any origin.
        node: >-
          cors({ origin: ['https://app.example.com'], credentials: true }) —
          never origin: true together with credentials.
        java: >-
          Spring: CorsConfiguration.setAllowedOrigins(List.of("https://app.example.com"))
          with setAllowCredentials(true); avoid allowedOriginPatterns("*").
        php: Compare the Origin header against a fixed allow-list before echoing it.
      config_examples:
        nginx: >-
          Use a map of allowed origins and set Access-Control-Allow-Origin only
          when the request origin matches it.
    compensating_controls:
      - SameSite cookies and CSRF tokens
      - Token-based auth not sent automatically by the browser
    verification: >-
      Send requests with an untrusted Origin and confirm no
      Access-Control-Allow-Origin (or a fixed trusted value) is returned, and
      credentials are not allowed for it.
    references:
      - https://cwe.mitre.org/data/definitions/942.html
      - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/07-Testing_Cross_Origin_Resource_Sharing
    tags: [cors, browser-policy, owasp-a05]

  - key: sec_misconfig.permissive_cors
    kind: vulnerability
    aliases:
      - Permissive CORS Policy
    category: sec_misconfig
    cwe: CWE-942
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Low by default (wildcard origin without credentials). Raise to Medium
      if non-public data is served; it becomes CORS Misconfiguration if
      credentials are allowed.
    exploitability: Low — browsers do not send credentials to wildcard origins.
    business_impact: >-
      Any site can read responses that are not user-specific; a problem only
      if internal or sensitive data is served.
    why_it_matters: >-
      A wildcard CORS policy is broader than most applications need and can
      expose data that was assumed to be private.
    detection_signal: Access-Control-Allow-Origin is * on the response.
    false_positive_check: >-
      Confirm whether the endpoint serves data intended to be public (CDN
      assets and public APIs legitimately use *).
    triage_priority: P4
    remediation:
      immediate_mitigation: No emergency action unless non-public data is served.
      short_term_fix: >-
        Replace * with the specific origins that need access, or remove CORS
        headers from endpoints that are not called cross-origin.
      long_term_hardening: Define CORS centrally with an explicit origin allow-list.
      code_fix_examples:
        node: >-
          cors({ origin: ['https://app.example.com'] }) instead of the default wildcard.
      config_examples: {}
    compensating_controls:
      - Authentication on endpoints serving non-public data
    verification: >-
      Confirm the header now lists a specific origin, or is absent on
      endpoints not meant for cross-origin use.
    references:
      - https://cwe.mitre.org/data/definitions/942.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/07-Testing_Cross_Origin_Resource_Sharing
    tags: [cors, browser-policy, hardening]

  - key: sec_misconfig.insecure_cookie
    kind: vulnerability
    aliases:
      - Insecure Cookie
    category: sec_misconfig
    cwe: CWE-614
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Medium by default for session/auth cookies; Low for preference cookies.
      Several cookie findings on one host correlate into an
      "Insecure Cookie Configuration" issue.
    exploitability: >-
      Low to Medium — impact depends on which attribute is missing and
      whether XSS or plain-HTTP access also exists.
    business_impact: >-
      Weakens protection of session and preference data against interception
      or script access.
    why_it_matters: >-
      A cookie is issued without one or more protective attributes (Secure,
      HttpOnly, SameSite).
    detection_signal: A Set-Cookie header is missing Secure, HttpOnly, or SameSite.
    false_positive_check: >-
      Identify what the cookie holds; attributes matter most for session,
      authentication, and CSRF cookies. Some analytics cookies intentionally
      lack HttpOnly.
    triage_priority: P3
    remediation:
      immediate_mitigation: Add the missing attributes at the edge proxy.
      short_term_fix: >-
        Set Secure, HttpOnly (where scripts do not need the value), and
        SameSite on cookies in application or framework configuration.
      long_term_hardening: Centralize cookie creation in one helper with secure defaults.
      code_fix_examples:
        python: response.set_cookie(name, value, secure=True, httponly=True, samesite="Lax")
        node: >-
          res.cookie(name, value, { secure: true, httpOnly: true, sameSite: 'lax' })
        java: Use ResponseCookie.from(name, value).secure(true).httpOnly(true).sameSite("Lax")
        php: setcookie($name, $value, ['secure' => true, 'httponly' => true, 'samesite' => 'Lax'])
      config_examples:
        nginx: proxy_cookie_flags ~ secure httponly samesite=lax;
    compensating_controls:
      - HSTS and strict CSP
    verification: Inspect Set-Cookie headers and confirm the attributes are present.
    references:
      - https://cwe.mitre.org/data/definitions/614.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
    tags: [cookies, hardening, owasp-a05]

  - key: sec_misconfig.dangerous_http_method
    kind: vulnerability
    aliases:
      - Dangerous HTTP Method Enabled
    category: sec_misconfig
    cwe: CWE-650
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Medium by default. Raise to High if write methods (PUT/DELETE) change
      server content without authentication; lower to Low when only TRACE is
      enabled.
    exploitability: >-
      Low to Medium — depends on whether the method is honoured with an
      effect or only advertised.
    business_impact: >-
      Unauthorized modification or deletion of files, or diagnostic methods
      that can aid other attacks.
    why_it_matters: >-
      The server accepts HTTP methods the application does not need.
    detection_signal: >-
      The server advertises or accepts methods such as TRACE, PUT, or DELETE
      on paths where they are not expected.
    false_positive_check: >-
      Confirm the method is actually honoured with a success status and an
      effect (advertised-only in Allow is lower risk); REST APIs legitimately
      use PUT/DELETE on authenticated routes.
    triage_priority: P3
    remediation:
      immediate_mitigation: Block unneeded methods at the edge.
      short_term_fix: >-
        Allow only the methods each route needs and require authentication for
        write methods; disable TRACE.
      long_term_hardening: Define allowed methods per route in the framework router.
      code_fix_examples: {}
      config_examples:
        nginx: if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }  (scoped to non-API locations)
        apache: TraceEnable Off and <LimitExcept GET POST HEAD> Require all denied </LimitExcept>
    compensating_controls:
      - WAF method allow-list
    verification: Send the method to the affected path and confirm 405.
    references:
      - https://cwe.mitre.org/data/definitions/650.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/06-Test_HTTP_Methods
    tags: [http-methods, hardening, owasp-a05]

  - key: sec_misconfig.directory_listing
    kind: vulnerability
    aliases:
      - Directory Listing Enabled
    category: sec_misconfig
    cwe: CWE-548
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Medium by default. Raise to High if the listed directory contains
      backups, configuration, or user uploads; lower to Low for intentionally
      public static assets.
    exploitability: Medium — browsing the listing requires no special access.
    business_impact: >-
      Exposes file names and contents that were not meant to be discoverable.
    why_it_matters: >-
      The web server generates an index of directory contents when no index
      file exists.
    detection_signal: A directory URL returned an auto-generated file listing.
    false_positive_check: >-
      Confirm the listing is server-generated (not an intentional file-browser
      page) and review what it exposes.
    triage_priority: P3
    remediation:
      immediate_mitigation: Disable auto-indexing for the directory at the server or edge.
      short_term_fix: >-
        Turn off directory listing globally and remove sensitive files from
        served directories.
      long_term_hardening: Serve only built assets; keep uploads outside the web root behind a handler.
      code_fix_examples: {}
      config_examples:
        nginx: autoindex off;
        apache: Options -Indexes
    compensating_controls:
      - Empty index file in each served directory
    verification: Request the directory URL and confirm 403/404 or the application page.
    references:
      - https://cwe.mitre.org/data/definitions/548.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information
    tags: [exposure, directory-listing, owasp-a05]

  - key: sec_misconfig.server_info_disclosure
    kind: vulnerability
    aliases:
      - Server Information Disclosure
    category: sec_misconfig
    cwe: CWE-200
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Low. Raise to Medium only if the disclosed version has a known,
      applicable vulnerability (track that as its own finding). Correlates
      into the "HTTP Security Hardening Gap" with other header findings.
    exploitability: Low — helps reconnaissance only.
    business_impact: Shortens an attacker's research by revealing exact server software and versions.
    why_it_matters: >-
      Response headers or error pages reveal the web server product and
      version.
    detection_signal: Server (or similar) headers or error pages include product and version strings.
    false_positive_check: >-
      Confirm the version string reflects the real origin server rather than
      a CDN or load balancer banner.
    triage_priority: P4
    remediation:
      immediate_mitigation: No emergency action.
      short_term_fix: Suppress version banners in server configuration.
      long_term_hardening: >-
        Keep server software patched (the real control) and include banner
        suppression in the hardening baseline.
      code_fix_examples: {}
      config_examples:
        nginx: server_tokens off;
        apache: ServerTokens Prod and ServerSignature Off
    compensating_controls:
      - Patch management for the web server
    verification: Inspect response headers and error pages and confirm no version string.
    references:
      - https://cwe.mitre.org/data/definitions/200.html
      - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/02-Fingerprint_Web_Server
      - https://owasp.org/www-project-secure-headers/
    tags: [disclosure, banners, hardening]

  - key: sec_misconfig.technology_disclosure
    kind: vulnerability
    aliases:
      - Technology Disclosure
    category: sec_misconfig
    cwe: CWE-200
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Low. Correlates into the "HTTP Security Hardening Gap" with other
      header findings; raise only when a disclosed component version is known
      to be vulnerable.
    exploitability: Low — reconnaissance aid only.
    business_impact: Reveals frameworks and versions that help target known weaknesses.
    why_it_matters: >-
      Headers such as X-Powered-By or framework-specific headers reveal the
      application stack.
    detection_signal: Framework or runtime banners such as X-Powered-By appear in responses.
    false_positive_check: Confirm the header is emitted by the application in production.
    triage_priority: P4
    remediation:
      immediate_mitigation: No emergency action.
      short_term_fix: Remove framework banner headers in the application or at the proxy.
      long_term_hardening: Include banner removal in the header baseline and keep components patched.
      code_fix_examples:
        node: app.disable('x-powered-by') (or use helmet).
        php: expose_php = Off
        java: Remove X-Powered-By via the servlet container configuration.
      config_examples:
        nginx: proxy_hide_header X-Powered-By;
        apache: Header unset X-Powered-By
    compensating_controls:
      - Patch management for disclosed components
    verification: Inspect responses and confirm framework banners are absent.
    references:
      - https://cwe.mitre.org/data/definitions/200.html
      - https://owasp.org/www-project-secure-headers/
    tags: [disclosure, banners, hardening]

  # --- Broken access control (batch 1g — user-supplied) ---------------------
  - key: bac.privilege_escalation_http_method
    kind: vulnerability
    aliases:
      - "Privilege Escalation via HTTP Method"
    category: bac
    cwe: CWE-650
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      Critical when a low-privilege or unauthenticated actor can perform a
      privileged action by changing the HTTP method (e.g. a write method reaching
      an admin function). High when the method reaches a function it should not,
      but impact is limited. Lower if the endpoint enforces role checks and only
      the method listing (Allow header) is permissive.
    exploitability: >-
      High. Requires only changing the request method against a known route; no
      special tooling.
    business_impact: >-
      Unauthorized state changes, data modification, or access to administrative
      functionality, leading to integrity loss and potential account/tenant
      compromise.
    why_it_matters: >-
      Authorization is often enforced on one method (e.g. GET) but not others,
      so a route assumed safe can still be acted on through an unguarded method.
    detection_signal: >-
      A route returns a success/effecting response for a method that should be
      rejected for the caller's role, or the Allow header advertises privileged
      methods without corresponding authorization.
    false_positive_check: >-
      Confirm with a low-privilege test account that the alternate method actually
      performs or exposes the privileged action, not merely that the method is
      listed in Allow. A method present in Allow but returning 403/401 when
      invoked is not a finding.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Add an authorization check to the affected route for every method, or
        block the unintended methods at the edge/proxy until the fix ships.
      short_term_fix: >-
        Enforce per-route method AND role/ownership checks server-side; deny by
        default and only allow the methods each role is entitled to.
      long_term_hardening: >-
        Centralize authorization in middleware/policy so no route relies on a
        single method being guarded; add tests that assert each method's required
        role.
      code_fix_examples:
        python: >-
          In a decorator/dependency, check request.method AND the user's role for
          the resource before the view runs; do not gate only inside the GET
          handler.
        node: >-
          Apply an authorization middleware to the router (all methods), then a
          per-handler ownership check; avoid method-specific guards that skip
          others.
        java: >-
          Use method-level @PreAuthorize on every mapping (GET/POST/PUT/DELETE),
          not just the read mapping; enforce at the service layer too.
        php: >-
          Route all methods through a policy/gate check before the controller
          action; never assume an unlisted method is unreachable.
      config_examples:
        nginx: >-
          limit_except GET POST { deny all; } on locations that must not accept
          other methods, as defense in depth (not a substitute for app authz).
    compensating_controls:
      - "Edge/WAF rule restricting methods per path"
      - "Audit logging + alerting on privileged method use by low-privilege roles"
    verification: >-
      With a low-privilege test account, invoke each method on the affected
      route and confirm every non-entitled method returns 401/403 with no
      state change.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://owasp.org/www-project-web-security-testing-guide/"
      - "https://cwe.mitre.org/data/definitions/650.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    tags: ["access-control", "authorization", "http-method"]

  - key: bac.idor
    kind: vulnerability
    aliases:
      - "Potential IDOR"
    category: bac
    cwe: CWE-639
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      Critical when another user's data can be modified or actions performed as
      them, or when sensitive records are readable across accounts. High for
      read-only exposure of other users' data. Lower to Medium/informational if
      changing the identifier only ever returns the caller's own data.
    exploitability: >-
      High. Typically requires only substituting an object identifier in a
      request the caller is already authorized to make.
    business_impact: >-
      Cross-account data disclosure or modification, privacy/regulatory exposure,
      and loss of tenant isolation.
    why_it_matters: >-
      Object references are frequently trusted from the client without verifying
      the caller owns or may access that specific object.
    detection_signal: >-
      A request that includes an object identifier returns or affects an object
      that does not belong to the authenticated caller.
    false_positive_check: >-
      Confirm with TWO consenting test accounts: account B requesting account A's
      identifier returns account A's data or performs an action on it. A
      sequential/guessable id that still only returns the caller's own data is
      not IDOR.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Add an ownership/authorization check at the data-access layer for the
        affected object type, or restrict the endpoint until fixed.
      short_term_fix: >-
        On every object access, verify the authenticated principal is authorized
        for that specific object (ownership or ABAC/RBAC) at the data layer, not
        only in the UI.
      long_term_hardening: >-
        Prefer per-user indirect references or scoped queries (filter by owner in
        the query), enforce deny-by-default, and add automated authorization
        tests per object type.
      code_fix_examples:
        python: >-
          Scope the query to the owner, e.g. select the object WHERE id = :id AND
          owner_id = current_user.id; return 404 if no row, rather than fetching
          by id then checking later.
        node: >-
          In the data layer, query with both the id and the owner/tenant from the
          session; never fetch by id alone and trust it.
        java: >-
          Add an ownership predicate to the repository method (findByIdAndOwner)
          and enforce it; do not rely on the presence of a valid id.
        php: >-
          Constrain the query by the authenticated user/tenant (where owner_id =
          ?) and treat a missing row as not-found.
      config_examples: {}
    compensating_controls:
      - "Row-level security / tenant scoping in the database"
      - "Audit logging of cross-object access attempts"
    verification: >-
      With two consenting test accounts, request account A's object as account
      B and confirm a 404/403 with no data returned or changed; confirm each
      account still reaches its own objects.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/639.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["access-control", "idor", "authorization", "multi-tenant"]

  - key: bac.forced_browsing
    kind: vulnerability
    aliases:
      - "Forced Browsing"
    category: bac
    cwe: CWE-425
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      High when a protected or administrative function is served successfully
      without authentication. Medium if the exposed path reveals structure but no
      sensitive function/data. Raise toward Critical if the reachable function is
      privileged.
    exploitability: >-
      Medium. Requires knowing or discovering the path; no auth bypass tooling
      beyond a direct request.
    business_impact: >-
      Access to functionality or data intended to be gated, bypassing the
      application's navigation and access controls.
    why_it_matters: >-
      Protection by obscurity (unlinked URLs) fails once a path is known; each
      endpoint must enforce its own authorization.
    detection_signal: >-
      A path expected to require authentication returns a 200 with real content
      instead of a redirect to login or a 401/403.
    false_positive_check: >-
      Distinguish a genuinely served protected page from a soft-404, SPA
      catch-all, or a login page returned with 200. Confirm the response contains
      the protected function/content while unauthenticated.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Require authentication/authorization on the exposed path, or block it at
        the edge until the check is in place.
      short_term_fix: >-
        Apply deny-by-default routing so every non-public route enforces auth;
        add the missing authorization check to the endpoint.
      long_term_hardening: >-
        Centralize route protection (a single auth gate that new routes inherit),
        and add tests asserting protected routes reject anonymous requests.
      code_fix_examples:
        python: >-
          Require the auth dependency on the router/blueprint by default and
          opt-in public routes explicitly, rather than protecting routes
          individually.
        node: >-
          Mount an auth middleware on the protected router prefix; return 401/redirect
          for anonymous requests before the handler runs.
        java: >-
          Configure the security filter chain to authenticate all requests except
          an explicit public allowlist (deny by default).
        php: >-
          Group protected routes under an auth middleware; treat anything not in
          the public list as requiring a session.
      config_examples:
        nginx: >-
          As defense in depth, gate sensitive prefixes behind auth_request or an
          upstream check; do not rely on it as the only control.
    compensating_controls:
      - "Deny-by-default reverse-proxy rules for admin/internal prefixes"
      - "Monitoring for anonymous 200s on protected prefixes"
    verification: >-
      Request the path without a session and confirm a 401/403 or login
      redirect; confirm an authorized test account still reaches it.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/425.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    tags: ["access-control", "forced-browsing", "authorization"]

  - key: bac.exposed_path
    kind: vulnerability
    aliases:
      - "Broken Access Control - Exposed Path"
    category: bac
    cwe: CWE-284
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      High by default. Severity follows what the path exposes: Critical/High if an
      admin/authenticated function or sensitive data is reachable without proper
      authorization; Medium if it exposes structure or non-sensitive content.
      Raise when the path allows state changes.
    exploitability: >-
      Medium. Direct request to the path; impact depends on what it exposes.
    business_impact: >-
      Access to resources or functions outside the caller's authorization,
      undermining tenant/role separation.
    why_it_matters: >-
      An exposed path indicates authorization is not enforced consistently across
      the application's surface.
    detection_signal: >-
      A path that should be restricted is reachable and returns
      functional/sensitive content for a caller who should not have access.
    false_positive_check: >-
      Confirm the content is genuinely privileged/sensitive and that the caller's
      role should not reach it; rule out intentionally public paths and generic
      error pages.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Restrict the path (auth + role check) or block it at the edge; if it
        exposed secrets/config, rotate anything revealed.
      short_term_fix: >-
        Enforce authorization on the path at the application layer with
        deny-by-default; validate role/ownership for the resource it serves.
      long_term_hardening: >-
        Inventory the route surface, apply a consistent authorization policy, and
        add coverage that every sensitive path enforces its intended role.
      code_fix_examples:
        python: >-
          Attach the authorization check to the resource handler and verify the
          principal's role/ownership before returning data.
        node: >-
          Guard the route with auth + a resource-level authorization check;
          deny-by-default for anything not explicitly public.
        java: >-
          Enforce the required authority on the mapping and re-check at the
          service layer for the specific resource.
        php: >-
          Wrap the path in an auth+policy check; do not serve restricted content
          based on an unlinked URL.
      config_examples: {}
    compensating_controls:
      - "Reverse-proxy allowlist for sensitive prefixes"
      - "Access logging + alerting on unauthorized-role access"
    verification: >-
      Request the path as an unauthenticated user and as a lower-role test
      account and confirm both are denied; confirm the intended role still has
      access.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/284.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"
    tags: ["access-control", "authorization", "exposed-path"]

  - key: bac.robots_disclosure
    kind: signal
    aliases:
      - "Information Disclosure - Robots.txt"
    category: bac
    cwe: CWE-200
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      Info. robots.txt disclosing paths is a hint, not a vulnerability in itself.
      Raise only if a disclosed path is itself unprotected (handle under the
      relevant access-control entry).
    exploitability: >-
      Low. Reveals path names; provides no access on its own.
    business_impact: >-
      May point discovery at sensitive areas if those areas are not properly
      protected.
    why_it_matters: >-
      Listing sensitive paths in robots.txt relies on obscurity and can guide
      attention to areas that must be protected by real authorization.
    detection_signal: >-
      robots.txt contains Disallow entries referencing admin/internal/sensitive
      paths.
    false_positive_check: >-
      Confirm the referenced paths are actually sensitive; a Disallow entry alone
      is informational and does not indicate a flaw.
    triage_priority: P4
    remediation:
      immediate_mitigation: >-
        Ensure any path referenced in robots.txt is protected by authentication/
        authorization, not by omission.
      short_term_fix: >-
        Remove sensitive path names from robots.txt; rely on real access controls
        for protection.
      long_term_hardening: >-
        Adopt a policy that robots.txt never enumerates sensitive endpoints;
        protect such endpoints with auth and monitor access.
      code_fix_examples: {}
      config_examples: {}
    compensating_controls:
      - "Authorization on all referenced paths"
      - "Monitoring of access to previously disclosed paths"
    verification: >-
      Confirm each path referenced in robots.txt denies unauthenticated
      requests, and that robots.txt no longer lists sensitive paths.
    references:
      - "https://owasp.org/www-project-web-security-testing-guide/"
      - "https://cwe.mitre.org/data/definitions/200.html"
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
    tags: ["information-disclosure", "robots", "signal"]

  # --- Info disclosure + recon (batch 1h — user-supplied) --------------------
  - key: info_disclosure.exposed_sensitive_file
    kind: vulnerability
    aliases:
      - "Exposed Sensitive File"
    category: info_disclosure
    cwe: CWE-538
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High by default; Critical if the file contains secrets, credentials, keys,
      or full source/config. Lower to Medium/Low for non-sensitive files (sample
      data, public assets misclassified). Always pair a secret-bearing file with
      a rotate-exposed-credentials action.
    exploitability: >-
      High. A direct GET retrieves the file; no tooling required.
    business_impact: >-
      Disclosure of secrets, internal structure, or data leading to further
      compromise, credential theft, or privacy exposure.
    why_it_matters: >-
      Sensitive files left in the web root are directly retrievable and often
      contain material that enables deeper attacks.
    detection_signal: >-
      A request to a known-sensitive path returns 200 with genuine file content
      (config, backup, source, key material) rather than a 404 or app page.
    false_positive_check: >-
      Confirm the response is the real file, not a soft-404 or SPA fallback, and
      that its contents are actually sensitive; a public sample file is not a
      finding.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Block the path at the edge/proxy and remove the file from the web root;
        if it exposed secrets, rotate them now and review access logs.
      short_term_fix: >-
        Move configuration, backups, and source out of web-served directories;
        deny dotfiles and backup extensions by default.
      long_term_hardening: >-
        Add deployment checks that fail the build if secrets or backup/config
        files land in the served path; keep secrets in a vault/env, not files.
      code_fix_examples: {}
      config_examples:
        nginx: >-
          location ~* \.(env|bak|old|sql|zip|tar|gz|pem|key)$ { deny all; return 404; }
        apache: >-
          <FilesMatch "\.(env|bak|old|sql|zip|tar|gz|pem|key)$"> Require all denied </FilesMatch>
    compensating_controls:
      - "WAF/edge deny rules for sensitive extensions and paths"
      - "Secret scanning in CI and on the deployed artifact"
    verification: >-
      Request the file path and confirm 403/404; confirm the file is gone from
      the deployed web root and any exposed secrets were rotated.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://owasp.org/www-project-web-security-testing-guide/"
      - "https://cwe.mitre.org/data/definitions/538.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
    tags: ["information-disclosure", "sensitive-file", "secrets"]

  - key: recon.tls_issue
    kind: vulnerability
    aliases:
      - "SSL/TLS Issue"
      - "TLS / SSL Issue"
    category: recon
    cwe: CWE-326
    owasp: "A02:2021-Cryptographic Failures"
    severity_guidance: >-
      High when weak protocols/ciphers are negotiable or the certificate is
      invalid/expired on an internet-facing service handling sensitive data.
      Lower to Medium for cosmetic issues (e.g. missing OCSP stapling) with
      modern protocols otherwise enforced.
    exploitability: >-
      Medium. Weak TLS enables interception under network-position conditions;
      not a direct remote exploit on its own.
    business_impact: >-
      Interception or tampering of data in transit, loss of confidentiality/
      integrity, and compliance failures.
    why_it_matters: >-
      Outdated protocols and weak ciphers undermine transport security even when
      the application is otherwise sound.
    detection_signal: >-
      The server negotiates deprecated protocols (SSLv3/TLS1.0/1.1) or weak
      ciphers, or presents an invalid/expired/mismatched certificate.
    false_positive_check: >-
      Confirm against the real origin (not a CDN/proxy edge) and that the weak
      protocol/cipher is actually negotiable, not merely listed.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Disable deprecated protocols and weak cipher suites at the terminating
        server/load balancer; renew or fix an invalid certificate.
      short_term_fix: >-
        Enforce TLS 1.2+ (prefer 1.3), a modern cipher suite list, and a valid
        certificate chain; enable HSTS.
      long_term_hardening: >-
        Automate certificate renewal, monitor expiry, and periodically re-baseline
        the TLS config against current guidance.
      code_fix_examples: {}
      config_examples:
        nginx: >-
          ssl_protocols TLSv1.2 TLSv1.3; ssl_ciphers <modern list>; ssl_prefer_server_ciphers on;
        apache: >-
          SSLProtocol -all +TLSv1.2 +TLSv1.3; SSLCipherSuite <modern list>; SSLHonorCipherOrder on
    compensating_controls:
      - "HSTS with a long max-age once HTTPS is enforced"
      - "TLS monitoring / expiry alerting"
    verification: >-
      Re-run the platform's TLS check against the origin and confirm only TLS
      1.2/1.3 with modern ciphers are negotiated and the certificate is valid.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/326.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["tls", "crypto", "transport-security"]

  - key: recon.non_https
    kind: vulnerability
    aliases:
      - "Non-HTTPS Connection"
    category: recon
    cwe: CWE-319
    owasp: "A02:2021-Cryptographic Failures"
    severity_guidance: >-
      Medium by default; High if credentials, sessions, or sensitive data are
      transmitted over plaintext HTTP. Lower for purely static public content
      with no user input.
    exploitability: >-
      Medium. Plaintext traffic can be read/modified by a network-positioned
      party.
    business_impact: >-
      Exposure of credentials, tokens, or data in transit and susceptibility to
      injection/tampering.
    why_it_matters: >-
      Any sensitive exchange over HTTP can be observed or altered on the path.
    detection_signal: >-
      The service is reachable over HTTP without redirecting to HTTPS, or serves
      sensitive functionality on plaintext.
    false_positive_check: >-
      Confirm HTTP is actually served (not merely a redirect to HTTPS) and that
      it carries sensitive content or accepts input.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Redirect all HTTP to HTTPS at the edge and disable plaintext handling of
        sensitive endpoints.
      short_term_fix: >-
        Enforce HTTPS site-wide, set Secure cookies, and add HSTS.
      long_term_hardening: >-
        Preload HSTS where appropriate and monitor for any plaintext exposure in
        new services.
      code_fix_examples: {}
      config_examples:
        nginx: >-
          server { listen 80; return 301 https://$host$request_uri; }
        apache: >-
          Redirect permanent / https://example.com/  (or mod_rewrite to HTTPS)
    compensating_controls:
      - "HSTS header once HTTPS is enforced"
      - "Secure attribute on all cookies"
    verification: >-
      Request the site over HTTP and confirm a 301 to HTTPS; confirm HSTS is
      present on HTTPS responses.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/319.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["https", "transport-security", "plaintext"]

  - key: recon.ssl_certificate
    kind: signal
    aliases:
      - "SSL Certificate"
    category: recon
    cwe: CWE-295
    owasp: "A02:2021-Cryptographic Failures"
    severity_guidance: >-
      Info by default; treat as a signal reporting certificate details. Raise to
      a TLS finding only if the certificate is invalid, expired, self-signed on a
      public service, or name-mismatched.
    exploitability: >-
      Low. Certificate metadata alone provides no access.
    business_impact: >-
      Context for TLS posture; an invalid certificate would enable interception
      or erode user trust.
    why_it_matters: >-
      Certificate validity and expiry are core to transport trust and warrant
      monitoring.
    detection_signal: >-
      The scan reports the presented certificate's issuer, validity window, and
      subject/SANs.
    false_positive_check: >-
      Confirm the certificate is served by the real origin; a proxy edge may
      present a different certificate than the backend.
    triage_priority: P4
    remediation:
      immediate_mitigation: >-
        Verify the certificate is valid, unexpired, and matches the hostname; act
        via the TLS finding if not.
      short_term_fix: >-
        Ensure automated renewal and correct SAN coverage for all served names.
      long_term_hardening: >-
        Monitor expiry and certificate transparency logs for the domain.
      code_fix_examples: {}
      config_examples: {}
    compensating_controls:
      - "Expiry monitoring and alerting"
      - "Automated renewal (ACME)"
    verification: >-
      Confirm the certificate is valid for all served names and that expiry
      monitoring and automated renewal are in place.
    references:
      - "https://cwe.mitre.org/data/definitions/295.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["tls", "certificate", "signal"]

  - key: recon.api_endpoint
    kind: signal
    aliases:
      - "API Endpoint Detected"
    category: recon
    cwe: CWE-200
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Info. A discovered API endpoint is context for further review, not a flaw
      in itself. Raise only if the endpoint itself is found unauthenticated or
      leaking data (handle under the relevant entry).
    exploitability: >-
      Low. Discovery only; no access implied.
    business_impact: >-
      Expands the reviewed attack surface; value is in ensuring each endpoint is
      authenticated and rate-limited.
    why_it_matters: >-
      Knowing the API surface lets the team confirm authorization and input
      validation on each route.
    detection_signal: >-
      A request or response pattern indicating an API route (JSON, REST/GraphQL
      path, api subdomain/prefix).
    false_positive_check: >-
      Confirm it is a live API route rather than a static asset or documentation
      page.
    triage_priority: P4
    remediation:
      immediate_mitigation: >-
        Verify the endpoint enforces authentication/authorization and rate
        limiting; restrict if it should not be public.
      short_term_fix: >-
        Ensure input validation, authz, and consistent error handling on the
        route.
      long_term_hardening: >-
        Maintain an API inventory with owner, auth, and rate-limit status per
        route.
      code_fix_examples: {}
      config_examples: {}
    compensating_controls:
      - "API gateway with auth and rate limiting"
      - "Route inventory / API catalog"
    verification: >-
      Confirm the endpoint is recorded in the API inventory with an owner and
      that unauthenticated requests are rejected where auth is required.
    references:
      - "https://owasp.org/www-project-api-security/"
      - "https://cwe.mitre.org/data/definitions/200.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["api", "discovery", "signal"]

  - key: recon.url_parameters
    kind: signal
    aliases:
      - "URL Parameters"
    category: recon
    cwe: CWE-200
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Info. Enumerated parameters are context for input-validation review, not a
      flaw. Raise only if a parameter is shown to drive an actual issue (handle
      under that issue's entry).
    exploitability: >-
      Low. Parameter names alone provide no access.
    business_impact: >-
      Guides where to confirm input validation and authorization.
    why_it_matters: >-
      Mapping parameters helps ensure each input is validated and access-checked.
    detection_signal: >-
      Query/body parameters observed on the target's endpoints.
    false_positive_check: >-
      Confirm the parameters are actually processed by the application rather
      than ignored.
    triage_priority: P4
    remediation:
      immediate_mitigation: >-
        Ensure each processed parameter is validated and authorized where it
        affects data or actions.
      short_term_fix: >-
        Apply centralized input validation and reject unexpected parameters.
      long_term_hardening: >-
        Adopt schema-based request validation across endpoints.
      code_fix_examples: {}
      config_examples: {}
    compensating_controls:
      - "Schema/request validation middleware"
      - "Allowlist of accepted parameters per endpoint"
    verification: >-
      Confirm the listed parameters are covered by request validation and that
      unexpected parameters are rejected.
    references:
      - "https://cwe.mitre.org/data/definitions/200.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["parameters", "discovery", "signal"]

  # --- Cloud (batch 1i — user-supplied) --------------------------------------
  - key: cloud.public_s3_bucket
    kind: vulnerability
    aliases:
      - "Public S3 Bucket"
    category: cloud
    cwe: CWE-732
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Critical when a bucket exposes sensitive/private data publicly or allows
      public write. Lower to Medium if the bucket intentionally serves public
      static assets with no sensitive content and no write access.
    exploitability: >-
      High. Public objects are directly retrievable; public write allows
      tampering or hosting of malicious content.
    business_impact: >-
      Data disclosure, defacement, or supply-chain abuse via writable buckets,
      plus regulatory exposure.
    why_it_matters: >-
      Misconfigured object storage is a common source of large data exposures.
    detection_signal: >-
      A bucket lists or serves objects to unauthenticated requests, or accepts
      unauthenticated writes.
    false_positive_check: >-
      Confirm the bucket is meant to be private and contains non-public data;
      an intentional public asset bucket with no sensitive content is expected.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Enable Block Public Access at the account and bucket level; remove public
        ACLs/policies; if data was exposed, assess and rotate anything sensitive.
      short_term_fix: >-
        Serve public assets via a CDN with least-privilege origin access; enforce
        private-by-default bucket policies.
      long_term_hardening: >-
        Enforce org-wide guardrails (SCP/Config rules) preventing public buckets;
        enable access logging and continuous posture checks.
      code_fix_examples: {}
      config_examples:
        aws: >-
          Enable s3 Block Public Access (account + bucket); remove public ACLs;
          use a bucket policy scoped to a CloudFront OAC for public assets.
    compensating_controls:
      - "CDN with origin access control for public assets"
      - "Cloud posture monitoring / Config rules"
    verification: >-
      Confirm unauthenticated list/read/write requests to the bucket are denied
      and Block Public Access shows enabled at account and bucket level.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/732.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["cloud", "s3", "storage", "exposure"]

  - key: cloud.accessible_s3_bucket
    kind: vulnerability
    aliases:
      - "Accessible S3 Bucket"
    category: cloud
    cwe: CWE-732
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      High when a bucket tied to the target is reachable/enumerable with weak
      controls. Raise to Critical if listing/reading sensitive objects succeeds;
      lower if it is an intentional public asset store.
    exploitability: >-
      Medium. Reachability plus weak controls can lead to disclosure.
    business_impact: >-
      Potential data disclosure and reconnaissance of internal object naming.
    why_it_matters: >-
      An enumerable bucket with loose permissions is a stepping stone to data
      exposure.
    detection_signal: >-
      A bucket associated with the target responds to requests indicating
      existence and permissive access.
    false_positive_check: >-
      Confirm the bucket belongs to the target and that access is actually
      permissive, not a generic existence response.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Restrict bucket policy/ACLs to least privilege; enable Block Public
        Access; review access logs.
      short_term_fix: >-
        Scope access to specific principals/roles; disable list where not needed.
      long_term_hardening: >-
        Guardrails preventing permissive buckets; continuous posture monitoring.
      code_fix_examples: {}
      config_examples:
        aws: >-
          Apply least-privilege bucket policy; enable Block Public Access; turn on
          server access logging.
    compensating_controls:
      - "Least-privilege IAM"
      - "Access logging + alerting"
    verification: >-
      Confirm unauthenticated list and read requests are denied and the bucket
      policy grants access only to the intended principals.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/732.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["cloud", "s3", "storage"]

  - key: cloud.aws_credential_exposure
    kind: vulnerability
    aliases:
      - "AWS Credential Exposure"
    category: cloud
    cwe: CWE-522
    owasp: "A07:2021-Identification and Authentication Failures"
    severity_guidance: >-
      Critical. Exposed cloud credentials can grant direct access to cloud
      resources. Treat as an active incident until scope is confirmed.
    exploitability: >-
      High. Valid keys can be used directly against cloud APIs.
    business_impact: >-
      Cloud account compromise, data access, resource abuse, and cost/impact
      escalation.
    why_it_matters: >-
      Leaked long-lived credentials are among the fastest paths to cloud
      compromise.
    detection_signal: >-
      AWS access key material appears in a response, file, or artifact tied to the
      target.
    false_positive_check: >-
      Confirm the key is real/active and belongs to the target (example/dummy keys
      and revoked keys are not a live finding).
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Revoke/rotate the exposed credentials now; review CloudTrail for misuse;
        begin incident response if used.
      short_term_fix: >-
        Remove secrets from code/artifacts; move to short-lived role credentials
        or a secrets manager.
      long_term_hardening: >-
        Enforce no-long-lived-keys policy, secret scanning in CI, and least
        privilege on all roles.
      code_fix_examples: {}
      config_examples:
        aws: >-
          Use IAM roles / STS short-lived credentials; store secrets in Secrets
          Manager/SSM; enable GuardDuty + CloudTrail.
    compensating_controls:
      - "Secret scanning in CI and on artifacts"
      - "GuardDuty / anomaly detection"
    verification: >-
      Confirm the exposed key shows as deactivated/deleted in IAM, the material
      is gone from the response or artifact, and CloudTrail review is recorded.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/522.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
    tags: ["cloud", "aws", "credentials", "incident"]

  - key: cloud.gcp_credential_exposure
    kind: vulnerability
    aliases:
      - "GCP Credential Exposure"
    category: cloud
    cwe: CWE-522
    owasp: "A07:2021-Identification and Authentication Failures"
    severity_guidance: >-
      Critical. Exposed GCP service-account keys can grant direct project access.
      Treat as an active incident until scope is confirmed.
    exploitability: >-
      High. Valid service-account keys authenticate directly to GCP APIs.
    business_impact: >-
      Project compromise, data access, and resource abuse.
    why_it_matters: >-
      Service-account key leakage is a direct route to cloud project compromise.
    detection_signal: >-
      A GCP service-account key/JSON appears in a response, file, or artifact tied
      to the target.
    false_positive_check: >-
      Confirm the key is real/active and belongs to the target; sample keys are
      not a live finding.
    triage_priority: P1
    remediation:
      immediate_mitigation: >-
        Disable/rotate the key now; review audit logs; begin incident response if
