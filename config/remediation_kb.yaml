  # --- CSRF / redirect / clickjack / upload / mobile / websocket / LLM ---
  # ---------- csrf ----------

  - key: csrf.missing_token
    kind: vulnerability
    aliases:
      - "Missing CSRF Token"
    category: csrf
    cwe: CWE-352
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      High when a state-changing request lacks CSRF protection and relies on cookie
      auth. Lower to Medium if requests use non-cookie auth (bearer tokens) that
      browsers do not attach automatically.
    exploitability: >-
      Medium. Requires luring an authenticated user to trigger a forged request.
    business_impact: >-
      Unauthorized state changes performed as the victim (settings, transfers,
      account changes).
    why_it_matters: >-
      Cookie-authenticated state-changing requests without anti-CSRF can be forged
      from other sites.
    detection_signal: >-
      A state-changing endpoint accepts a request without a valid anti-CSRF token
      while using cookie-based auth.
    false_positive_check: >-
      Confirm the endpoint relies on cookies (not a bearer token) and that no
      token/SameSite protection is enforced.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Set SameSite=Lax/Strict on session cookies and require an anti-CSRF token on
        state-changing routes.
      short_term_fix: >-
        Use the framework's CSRF protection (synchronizer token or double-submit) on
        all cookie-authenticated state changes.
      long_term_hardening: >-
        Default CSRF protection on by framework config; prefer non-cookie auth for
        APIs; add tests that forged requests are rejected.
      code_fix_examples:
        python: >-
          Enable the framework CSRF middleware (Django/Flask-WTF) and require the
          token on POST/PUT/DELETE.
        node: >-
          Use a CSRF middleware with a per-session token and validate it on
          state-changing routes.
        java: >-
          Enable Spring Security CSRF protection (on by default) and keep it for
          cookie-based sessions.
      config_examples: {}
    verification: >-
      Confirm a state-changing request without a valid token is rejected on a test
      account.
    compensating_controls:
      - "SameSite cookies"
      - "Origin/Referer checks on state-changing routes"
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/352.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"
    tags: ["csrf", "state-change", "cookies"]

  - key: csrf.via_get
    kind: vulnerability
    aliases:
      - "CSRF via GET Request"
    category: csrf
    cwe: CWE-352
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      High when a state-changing action can be performed via GET (trivially forged
      via links/images). Lower only if the GET has no side effects.
    exploitability: >-
      High. A simple link/image can trigger the action for an authenticated user.
    business_impact: >-
      Unauthorized state changes triggered by simply loading a URL.
    why_it_matters: >-
      State-changing GETs are forgeable with basic HTML and bypass many protections.
    detection_signal: >-
      A GET request performs a state-changing action.
    false_positive_check: >-
      Confirm the GET actually changes state rather than only reading data.
    triage_priority: P2
    remediation:
      immediate_mitigation: >-
        Require POST (or another non-GET method) with an anti-CSRF token for the
        action.
      short_term_fix: >-
        Move all state changes off GET; apply CSRF protection to those routes.
      long_term_hardening: >-
        Enforce a policy that GET is side-effect-free; add tests catching
        state-changing GETs.
      code_fix_examples: {}
      config_examples: {}
    verification: >-
      Confirm the action can no longer be performed via GET and requires a valid
      token.
    compensating_controls:
      - "SameSite cookies"
      - "Method + token enforcement"
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/352.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"
    tags: ["csrf", "http-method", "state-change"]

  - key: csrf.samesite_none_cookie
    kind: vulnerability
    aliases:
      - "SameSite=None Cookie"
    category: csrf
    cwe: CWE-1275
    owasp: "A05:2021-Security Misconfiguration"
    severity_guidance: >-
      Medium when a session/auth cookie uses SameSite=None (sent cross-site),
      widening CSRF exposure. Lower if the cookie is non-sensitive or the app has
      strong token-based CSRF defenses.
    exploitability: >-
      Medium. Cross-site cookie attachment enables forged requests if no token
      defense exists.
    business_impact: >-
      Increased CSRF exposure for cookie-authenticated actions.
    why_it_matters: >-
      SameSite=None sends the cookie on cross-site requests, so other defenses must
      carry the load.
    detection_signal: >-
      A sensitive cookie is set with SameSite=None.
    false_positive_check: >-
      Confirm the cookie is sensitive and that SameSite=None is not required for a
      legitimate cross-site flow lacking other CSRF defenses.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Set SameSite=Lax (or Strict) on session/auth cookies unless a documented
        cross-site need exists.
      short_term_fix: >-
        Where SameSite=None is required, ensure robust anti-CSRF tokens and Secure
        flag are in place.
      long_term_hardening: >-
        Default cookies to Lax/Strict; review any None usage in code review.
      code_fix_examples: {}
      config_examples: {}
    verification: >-
      Confirm the cookie is issued with SameSite=Lax/Strict (or, if None, with token
      defenses) after the change.
    compensating_controls:
      - "Anti-CSRF tokens"
      - "Secure cookie flag"
    references:
      - "https://cwe.mitre.org/data/definitions/1275.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"
      - "https://owasp.org/www-project-web-security-testing-guide/"
    tags: ["csrf", "samesite", "cookies"]

  # ---------- open_redirect ----------

  - key: open_redirect.open_redirect
    kind: vulnerability
    aliases:
      - "Open Redirect"
    category: open_redirect
    cwe: CWE-601
    owasp: "A01:2021-Broken Access Control"
    severity_guidance: >-
      Medium by default; raise if the redirect is used in auth flows (e.g. OAuth
      return, post-login) where it aids phishing or token theft. Lower for
      non-sensitive redirects.
    exploitability: >-
      Medium. Requires crafting a link with an attacker-controlled destination.
    business_impact: >-
      Phishing credibility, and in auth flows, potential token/credential leakage.
    why_it_matters: >-
      Redirecting to attacker-controlled URLs abuses the site's trust for phishing.
    detection_signal: >-
      A redirect parameter sends the user to an external, attacker-controlled URL.
    false_positive_check: >-
      Confirm the destination is externally controllable and actually followed, not
      validated/allowlisted.
    triage_priority: P3
    remediation:
      immediate_mitigation: >-
        Restrict redirects to an allowlist of internal paths/hosts; reject external
        targets.
      short_term_fix: >-
        Use server-side mapping keys or relative paths instead of full URLs from
        input; validate against an allowlist.
      long_term_hardening: >-
        Centralize redirect handling with strict validation and tests.
      code_fix_examples:
        python: >-
          Validate the target against an allowlist of internal paths; never redirect
          to a raw user-supplied absolute URL.
        node: >-
          Map a short key to an internal path server-side; reject off-site
          destinations.
      config_examples: {}
    verification: >-
      Confirm an external destination is rejected and only allowlisted targets
      redirect after the fix.
    compensating_controls:
      - "Redirect allowlist"
