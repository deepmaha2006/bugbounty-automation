# HydraX connector proxy — all traffic to victim passes through here.
# iptables on this container's INPUT chain is what block_source modifies.
# WAF rules in /hydrax-waf-rules/*.conf are included here (S10).

server {
    listen 80;
    server_name _;

    # Include HydraX WAF rule snippets (populated by apply_waf_rule jobs).
    include /hydrax-waf-rules/*.conf;

    access_log  /var/log/nginx/access.log combined;
    error_log   /var/log/nginx/error.log warn;

    location / {
        proxy_pass         http://victim:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
