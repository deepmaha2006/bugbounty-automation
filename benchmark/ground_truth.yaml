# HydraX Benchmark Ground Truth
# --------------------------------
# Labels for the FP/precision benchmark.  Add real Juice Shop and DVWA
# targets when running an end-to-end precision measurement.  The runner
# skips unreachable targets automatically (skip_if_unreachable: true) so
# the hermetic test suite still passes in a sandbox without them.
#
# Field reference
# ---------------
# known_vulnerable  — endpoints where a scanner MUST report ≥1 confirmed
#                     finding of the given type (TP if found, FN if missed)
# known_clean       — endpoints where a scanner MUST report 0 confirmed
#                     findings (FP if anything is reported)

targets:
  - name: juice_shop
    url: "http://localhost:3000"
    skip_if_unreachable: true
    known_vulnerable:
      - endpoint: "/rest/user/login"
        type: "SQL Injection"
        param: "email"
      - endpoint: "/api/Products/1"
        type: "Broken Access Control"
        param: null
      - endpoint: "/rest/products/search"
        type: "SQL Injection"
        param: "q"
    known_clean: []

  - name: dvwa
    url: "http://localhost:4280"
    skip_if_unreachable: true
    known_vulnerable:
      - endpoint: "/vulnerabilities/xss_r/"
        type: "Reflected XSS"
        param: "name"
      - endpoint: "/vulnerabilities/sqli/"
        type: "SQL Injection"
        param: "id"
      - endpoint: "/vulnerabilities/fi/"
        type: "Path Traversal"
        param: "page"
    known_clean: []

  - name: static_spa_negative
    url: "https://www.saucedemo.com"
    skip_if_unreachable: true
    known_vulnerable: []
    known_clean:
      - endpoint: "/"
        type: null   # expect zero confirmed injection findings here
